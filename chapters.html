      ],

        { id: "ch-afcat-reasoning-02", name: "Coding Decoding", desc: "Letter, number, mixed coding drills & pattern identification." }
      ],

        { id: "ch-afcat-eng-vocab-02", name: "One Word Substitution", desc: "Essential substitutions, roots & memory mnemonics." },
        { id: "ch-afcat-eng-vocab-03", name: "Synonyms & Antonyms", desc: "Targeted word list, contextual usage & eliminate drills." }
      ],

      ],
      "afcat-englishpractice": [
        { id: "ch-afcat-eng-prac-01", name: "Reading Comprehension", desc: "Theme deduction, inference logic & speed passage skimming." },
        { id: "ch-afcat-eng-prac-02", name: "Error Spotting Drills", desc: "Timed mixed grammatical question drills." }
      ],
      "afcat-generalawareness": [
        { id: "ch-afcat-ga-01", name: "Indian Defense & Missiles", desc: "Tri-service commands, equipment, badges & air defense wings." },
        { id: "ch-afcat-ga-02", name: "Static GK Masterlist", desc: "First in India, national parks, capitals & monuments." }
      ],
      "afcat-currentaffairs": [
        { id: "ch-afcat-ca-01", name: "Defense Exercises & Operations", desc: "Joint military/airforce war-games & tactical protocols." },
        { id: "ch-afcat-ca-02", name: "Monthly Current Affairs Recap", desc: "Key national, sports & international summits breakdown." }
      ],
      "afcat-gformexplanation": [
        { id: "ch-afcat-gform-01", name: "Mock Test Form Explanations", desc: "Section-by-section video solutions of assigned Google Forms." }
      ],

      // =========================================================================
      // 4. CDS OTA RECORDED SQUADRON (DYNAMIC SUBJECT MAPPINGS)
      // =========================================================================
      "cds-kilo-recorded-physicalgeography": [
        { id: "ch-rec-phys-climatology", name: "Climatology Dossier", desc: "Atmosphere, pressure belts, planetary winds & fronts (6 Sessions)." },
        { id: "ch-rec-phys-oceanography", name: "Oceanography Dossier", desc: "Ocean relief, temperature, salinity & oceanic currents (3 Sessions)." },
        { id: "ch-rec-phys-geomorphic", name: "Geomorphic Processes", desc: "Endogenic & exogenic forces, weathering & erosion (2 Sessions)." },
        { id: "ch-rec-phys-landforms", name: "Landforms Mastery", desc: "Running water, groundwater, glaciers, sea waves & wind landforms (5 Sessions)." },
        { id: "ch-rec-phys-internal", name: "Internal Earth Dynamics", desc: "Earthquake, interior, volcanoes, plate tectonics, rocks & minerals (5 Sessions)." }
      ],
      "cds-kilo-recorded-indiangeography": [
        { id: "ch-rec-ind-physio", name: "Physiography & Basics", desc: "Indian basics, Himalayas, plains, plateaus, coasts & islands (4 Sessions)." },
        { id: "ch-rec-ind-drainage", name: "Drainage Systems", desc: "Himalayan & Peninsular rivers, lakes & water resources (3 Sessions)." },
        { id: "ch-rec-ind-resources", name: "Resources & Environment", desc: "Soil, USDA taxonomy, natural vegetation & state of forest report (4 Sessions)." },
        { id: "ch-rec-ind-climate", name: "Indian Climate", desc: "Monsoon mechanisms, jet streams, western disturbances & seasons (3 Sessions)." },
        { id: "ch-rec-ind-infra", name: "Infrastructure & Minerals", desc: "Highways, railways, ports, minerals & industrial belts (3 Sessions)." }
      ],
      "cds-kilo-recorded-modernhistory": [
        { id: "ch-rec-mod-europeans", name: "Advent of Europeans", desc: "Estado da India, British, French & Dutch VOC (4 Sessions)." },
        { id: "ch-rec-mod-expansion", name: "British Expansion & Wars", desc: "Carnatic, Bengal, Mysore, Maratha, Punjab & Sindh annexation (6 Sessions)." },
        { id: "ch-rec-mod-economic", name: "Economic Policies & Uprisings", desc: "1757-1813 phases, Charter Acts, 1857 revolt, peasant & tribal revolts (6 Sessions)." },
        { id: "ch-rec-mod-reforms", name: "Socio-Religious Reforms", desc: "Social, religious, Muslim & Sikh reform movements (2 Sessions)." },
        { id: "ch-rec-mod-national", name: "National Movement & Freedom", desc: "Congress formation, Extremists, Surat split, NCM, CDM, GOI 1935 & Partition (11 Sessions)." }
      ],
      "cds-kilo-recorded-ancienthistory": [
        { id: "ch-rec-anc-prehistory", name: "Pre-History & IVC", desc: "Stone age phases & Indus Valley Civilization (6 Sessions)." },
        { id: "ch-rec-anc-vedic", name: "Vedic Age & Religions", desc: "Early & Later Vedic, Buddhism, Jainism, Indian Darshan & PYQs (9 Sessions)." },
        { id: "ch-rec-anc-empires", name: "Mahajanapadas & Mauryas", desc: "Magadh, Mauryan Empire in-depth & Post-Mauryan era (8 Sessions)." },
        { id: "ch-rec-anc-gupta", name: "Gupta & Sangam Age", desc: "Sangam literature, Gupta empire & Post-Gupta era (4 Sessions)." }
      ],
      "cds-kilo-recorded-polity": [
        { id: "ch-rec-pol-foundations", name: "Constitutional Framework", desc: "Making of Constitution, Preamble, Art 368, Majorities & Federalism (3 Sessions)." },
        { id: "ch-rec-pol-executives", name: "Union & State Executives", desc: "President, Governor, VP, PM, CM, COM & Attorney/Advocate General (4 Sessions)." },
        { id: "ch-rec-pol-legislatures", name: "Parliament & Assemblies", desc: "Parliament sessions 1-4, dissolution, committees & state legislature (7 Sessions)." },
        { id: "ch-rec-pol-relations", name: "Relations, Bodies & Emergency", desc: "Centre-State, Finance Commission, GST, Zonal councils, Art 371 & Emergency (4 Sessions)." }
      ],
      "cds-kilo-recorded-biology": [
        { id: "ch-rec-bio-cells", name: "Cell Biology & Genetics", desc: "Cell basics, final class, tissues & diversity (4 Sessions)." },
        { id: "ch-rec-bio-physiology", name: "Human Physiology", desc: "Digestion, excretion, heart, blood, respiration & reproduction (5 Sessions)." },
        { id: "ch-rec-bio-health", name: "Health, Plant & Ecology", desc: "Diseases, hormones, plant classification & biological kingdoms (4 Sessions)." }
      ],
      "cds-kilo-recorded-chemistry": [
        { id: "ch-rec-chem-core", name: "Core Chemistry Principles", desc: "Chemical reactions, acids, bases, salts, metals, non-metals & mixtures (4 Sessions)." },
        { id: "ch-rec-chem-atomic", name: "Atomic Theory & Carbon", desc: "Atoms, molecules, carbon & compounds, soap & detergent (5 Sessions)." },
        { id: "ch-rec-chem-applied", name: "Applied Science & Advanced", desc: "High level sessions, protein deficiency, fertility survey & allied topics (6 Sessions)." }
      ],
      "cds-kilo-recorded-englishgrammar": [
        { id: "ch-rec-eng-grammar", name: "Grammar Core Mechanics", desc: "Tense, Parts of Speech, Noun, Pronoun, Verb, Preposition, Conjunction & Voice (21 Sessions)." }
      ],
      "cds-kilo-recorded-englishpractice": [
        { id: "ch-rec-eng-practice", name: "Full Mocks & Practice Drills", desc: "Tense, Verb, S1-S2, & Full Mocks 1-8 comprehensive solutions (13 Sessions)." }
      ],
      "cds-kilo-recorded-economics": [
        { id: "ch-rec-eco-core", name: "Economics Essentials", desc: "National income, money, monetary policy, balance of payments & unemployment (5 Sessions)." }
      ],
      "cds-kilo-recorded-gsmuster": [
        { id: "ch-rec-gs-muster", name: "GS Tactical Muster", desc: "GS Muster intensive classes 1, 2, 3 & 4 (4 Sessions)." }
      ]
    };

    let activeBatch = "capf";
    let activeSubject = "Mentor Session";
    let activeMode = "live";
    let unsubscribeSnapshot = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        window.location.href = "index.html";
        return;
      }

      unsubscribeSnapshot = onSnapshot(doc(db, "cadets", user.uid), (docSnap) => {
        if (!docSnap.exists()) {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          signOut(auth).then(() => window.location.href = "index.html");
          return;
        }

        const data = docSnap.data();
        const localToken = localStorage.getItem("phantom_session_token");

        if (data.status !== "active") {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          alert("Notice: Cadet account is currently not active or pending verification.");
          signOut(auth).then(() => window.location.href = "index.html");
          return;
        }

        if (data.activeSession && localToken && data.activeSession !== localToken) {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          alert("SECURITY PROTOCOL: Active session detected on another terminal. Logging out.");
          signOut(auth).then(() => {
            localStorage.removeItem("phantom_session_token");
            localStorage.removeItem("phantom_uid");
            window.location.href = "index.html";
          });
          return;
        }

        renderChaptersList(data.allowedBatches || []);
      });
    });

    function renderChaptersList(allowedBatches) {
      const urlParams = new URLSearchParams(window.location.search);
      activeBatch = urlParams.get('batch') || 'capf';
      activeSubject = urlParams.get('subject') || 'Mentor Session';
      activeMode = urlParams.get('mode') || 'live';

      const isCombo = allowedBatches.includes('combo') || allowedBatches.includes('all');
      if (!isCombo && !allowedBatches.includes(activeBatch)) {
        alert("ACCESS RESTRICTED: You are not enrolled in this squadron.");
        window.location.href = "classroom.html";
        return;
      }

      const cleanBatch = activeBatch.toLowerCase().trim();
      const cleanSubject = activeSubject.toLowerCase().replace(/[^a-z0-9]/g, '');

      let lookupKey = `${cleanBatch}-${cleanSubject}`;
      if (cleanBatch === 'cds-kilo' && activeMode === 'recorded') {
        lookupKey = `cds-kilo-recorded-${cleanSubject}`;
      }

      const modeText = activeMode === 'recorded' ? 'RECORDED VAULT' : 'LIVE SQUADRON';
      document.getElementById('badgeIndicator').innerText = `${activeBatch.toUpperCase()} • ${modeText} • ${activeSubject.toUpperCase()}`;
      document.getElementById('subjectHeading').innerText = activeMode === 'recorded' ? `${activeSubject} (RECORDED)` : activeSubject;

      const container = document.getElementById('chaptersContainer');
      container.innerHTML = "";

      const chapters = chapterDatabase[lookupKey] || [
        {
          id: `${lookupKey}-pending`,
          name: `${activeSubject} - Briefing Module 01`,
          desc: "Comprehensive video briefings, dossiers, and revision series."
        }
      ];

      document.getElementById('chapterCountBadge').innerText = `${chapters.length} CHAPTERS ACTIVE`;

      chapters.forEach((chapter, index) => {
        const card = document.createElement('div');
        card.className = "armor-panel rounded-xl p-5 flex flex-col justify-between hover:border-amber-500/60 transition group cursor-pointer shadow-lg";
        card.onclick = () => openChapterLectures(chapter.name, chapter.id, activeSubject, activeMode);

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="px-2 py-0.5 rounded bg-black/60 border border-neutral-700 text-amber-400 font-mono text-[11px] font-bold">
                CHAPTER #${(index + 1).toString().padStart(2, '0')}
              </span>
              <span class="text-[10px] font-mono text-emerald-400 bg-emerald-950/40 border border-emerald-500/30 px-2 py-0.5 rounded">
                ACTIVE
              </span>
            </div>
            <h3 class="font-orbitron font-bold text-lg text-white group-hover:text-amber-400 transition mb-1">
              ${chapter.name}
            </h3>
            <p class="text-xs text-neutral-400 font-body leading-relaxed">
              ${chapter.desc || 'Comprehensive tactical video session.'}
            </p>
          </div>

          <div class="mt-6 pt-3 border-t border-neutral-800/80 flex items-center justify-between">
            <span class="text-xs font-orbitron font-bold text-amber-400 group-hover:underline">
              ENTER CHAPTER &rarr;
            </span>
            <span class="text-xs text-neutral-500 font-mono">LECTURES INSIDE</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openChapterLectures(chapterName, chapterId, subjectName, mode) {
      window.location.href = `lectures.html?batch=${encodeURIComponent(activeBatch)}&subject=${encodeURIComponent(subjectName)}&chapter=${encodeURIComponent(chapterName)}&chapterId=${encodeURIComponent(chapterId)}&mode=${encodeURIComponent(mode)}`;
    }

    window.navigateBackToSubjects = function() {
      window.location.href = `subjects.html?batch=${encodeURIComponent(activeBatch)}&mode=${encodeURIComponent(activeMode)}`;
    };

    window.terminateCadetSession = function() {
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      signOut(auth).then(() => {
        localStorage.removeItem("phantom_session_token");
        localStorage.removeItem("phantom_uid");
        window.location.href = "index.html";
      });
    };
  </script>

  <style>
    body { font-family: 'Rajdhani', sans-serif; background-color: #04070b; }
    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-body { font-family: 'Inter', sans-serif; }

    .tactical-bg {
      background: 
        radial-gradient(circle at 50% 10%, rgba(239, 68, 68, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 85% 60%, rgba(234, 179, 8, 0.14) 0%, transparent 50%),
        linear-gradient(180deg, rgba(4, 7, 13, 0.95) 0%, rgba(2, 4, 7, 0.99) 100%),
        url('https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=2000&q=80');
      background-size: cover; background-position: center; background-attachment: fixed;
    }

    .hud-grid {
      background-image: 
        linear-gradient(rgba(245, 158, 11, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 158, 11, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .armor-panel {
      background: rgba(10, 15, 22, 0.92);
      border: 1px solid rgba(245, 158, 11, 0.25);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>

          <img src="logo.jpeg" alt="Team Phantom Logo" class="w-full h-full object-cover rounded-lg" onerror="this.src='https://via.placeholder.com/150/000000/f59e0b?text=PHANTOM';">

          &larr; BACK TO SUBJECTS
        </button>
        <button onclick="window.terminateCadetSession()" class="bg-red-950/80 hover:bg-red-900 border border-red-700/80 text-red-300 text-xs font-orbitron font-bold px-3.5 py-2 rounded-lg uppercase tracking-wider transition cursor-pointer">

  <!-- MAIN CHAPTER SECTION -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">

      <div>
        <div class="inline-flex items-center gap-2 px-2.5 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/40 text-[11px] font-orbitron font-bold tracking-wider uppercase mb-1" id="badgeIndicator">
          BRIEFING DOSSIER
        </div>
        <h2 class="font-stencil text-2xl sm:text-3xl text-white tracking-wide uppercase" id="subjectHeading">
          LOADING CHAPTERS...
        </h2>
        <p class="text-xs text-neutral-400 font-body mt-1">Select an authorized chapter below to enter its tactical lecture archives.</p>
      </div>
      <div class="flex items-center gap-2 bg-black/60 border border-emerald-500/40 px-3.5 py-2 rounded-xl text-xs font-mono text-emerald-400">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="chapterCountBadge">READY</span>
      </div>
    </div>

    <!-- CHAPTER CARDS LIST -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="chaptersContainer"></div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full bg-black/95 border-t border-neutral-900 py-3.5 px-4 text-center">
    <p class="text-[11px] font-body text-neutral-500 tracking-wider">
      &copy; 2026 TEAM PHANTOM. MILITARY PRECISION PROTOCOL.
