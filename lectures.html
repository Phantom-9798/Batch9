    let currentBatch = "capf";
    let currentSubject = "Mentorship Sessions";
    let unsubscribeSnapshot = null;

    // Session Security Verification & Realtime Single Device Guard
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        window.location.href = "index.html";
        return;
      }

      unsubscribeSnapshot = onSnapshot(doc(db, "cadets", user.uid), (docSnap) => {
        if (!docSnap.exists()) {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          signOut(auth).then(() => window.location.href = "index.html");
          return;
        }

        const data = docSnap.data();
        const localToken = localStorage.getItem("phantom_session_token");

        // Status check
        if (data.status !== "active") {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          alert("Notice: Cadet account is currently not active or pending verification.");
          signOut(auth).then(() => window.location.href = "index.html");
          return;
        }

        // Single device session token verification
        if (data.activeSession && localToken && data.activeSession !== localToken) {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          alert("SECURITY PROTOCOL: Active session detected on another terminal. Logging out.");
          signOut(auth).then(() => {
            localStorage.removeItem("phantom_session_token");
            localStorage.removeItem("phantom_uid");
            window.location.href = "index.html";
          });
          return;
        }

        renderLecturesList(data.allowedBatches || []);
      });
    });

    function renderLecturesList(allowedBatches) {
      const urlParams = new URLSearchParams(window.location.search);
      currentBatch = urlParams.get('batch') || 'capf';
      currentSubject = urlParams.get('subject') || 'Mentorship Sessions';
      const chapterName = urlParams.get('chapter') || 'Briefing Dossier';
      const chapterId = urlParams.get('chapterId') || '';
      const mode = urlParams.get('mode') || 'live';

      // Security check for batch access
      const isCombo = allowedBatches.includes('combo') || allowedBatches.includes('all');
      if (!isCombo && !allowedBatches.includes(currentBatch)) {
        alert("ACCESS RESTRICTED: You are not enrolled in this squadron.");
        window.location.href = "classroom.html";
        return;
      }

      const modeBadge = mode === 'recorded' ? 'RECORDED VAULT' : 'LIVE SQUADRON';
      document.getElementById('badgeIndicator').innerText = `${currentBatch.toUpperCase()} • ${modeBadge} • ${currentSubject.toUpperCase()}`;
      document.getElementById('chapterHeading').innerText = chapterName;

      const container = document.getElementById('lecturesContainer');
      container.innerHTML = "";

      // Fetch Lectures
      const lectures = lectureDatabase[chapterId] || [];

      document.getElementById('lectureCountBadge').innerText = `${lectures.length} SESSIONS READY`;

      // Show message if empty (Shows "IT WILL BE UPLOADED VERY SOON")
      if (lectures.length === 0) {
        container.innerHTML = `
          <div class="col-span-full armor-panel rounded-2xl p-12 text-center border border-amber-500/30">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-amber-500/10 text-amber-400 mb-4 text-2xl">
              ⏳
            </div>
            <h3 class="font-orbitron text-lg sm:text-xl text-amber-400 font-bold tracking-wider mb-2 uppercase">
              IT WILL BE UPLOADED VERY SOON
            </h3>
            <p class="text-xs text-neutral-400 font-body max-w-md mx-auto">
              ${mode === 'recorded' 
                ? 'Recorded syllabus dossiers and video sessions for this module are currently under synchronization and will be available shortly.' 
                : `Tactical lectures and video briefings for "${chapterName}" are currently under preparation.`}
            </p>
          </div>
        `;
        return;
      }

      lectures.forEach((lec) => {
        const card = document.createElement('div');
        card.className = "armor-panel rounded-xl p-5 flex flex-col justify-between hover:border-amber-500/60 transition group shadow-lg";

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="px-2.5 py-0.5 rounded bg-black/80 border border-neutral-700 text-amber-400 font-mono text-xs font-bold">
                SESSION #${lec.lectureNo}
              </span>
              <span class="text-[11px] font-mono text-neutral-400 flex items-center gap-1">
                ⏱ ${lec.duration}
              </span>
            </div>
            <h3 class="font-orbitron font-bold text-base text-white group-hover:text-amber-400 transition mb-1.5">
              ${lec.title}
            </h3>
            <p class="text-xs text-neutral-400 font-body leading-relaxed mb-4">
              ${lec.desc || 'Comprehensive tactical video session.'}
            </p>
          </div>

          <div class="pt-3 border-t border-neutral-800/80 flex items-center gap-2">
            <button onclick="window.playLectureVideo('${lec.videoId}', '${lec.title.replace(/'/g, "\\'")}')" class="flex-1 py-2 bg-gradient-to-r from-amber-600 to-yellow-500 hover:from-amber-500 hover:to-yellow-400 text-black font-orbitron font-extrabold text-xs rounded-lg uppercase tracking-wider transition shadow cursor-pointer">
              WATCH LECTURE
            </button>
            <button onclick="window.openClassNotes('${lec.pdfUrl}', '${lec.title.replace(/'/g, "\\'")}')" class="px-3 py-2 bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-neutral-300 font-orbitron font-bold text-xs rounded-lg uppercase tracking-wider transition cursor-pointer">
              NOTES (PDF)
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Direct Play Router (Session Storage Guarded)
    window.playLectureVideo = function(videoId, title) {
      if (!videoId || videoId === "#" || videoId === "") {
        alert("It will be uploaded very soon.");
        return;
      }
      
      const cleanTitle = title || "TACTICAL SESSION";
      
      // Session storage mein direct store karenge taaki lamba URL cut na ho
      sessionStorage.setItem("phantom_current_video", videoId);
      sessionStorage.setItem("phantom_current_title", cleanTitle);

      window.location.href = "player.html";
    };

    window.openClassNotes = function(url, title) {
      if (!url || url === "#" || url === "") {
        alert("Notes dossier: It will be uploaded very soon.");
        return;
      }
      window.open(url, "_blank");
    };

    window.navigateBackToChapters = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const mode = urlParams.get('mode') || 'live';
      window.location.href = `chapters.html?batch=${encodeURIComponent(currentBatch)}&subject=${encodeURIComponent(currentSubject)}&mode=${encodeURIComponent(mode)}`;
    };

    window.terminateCadetSession = function() {
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      signOut(auth).then(() => {
        localStorage.removeItem("phantom_session_token");
        localStorage.removeItem("phantom_uid");
        window.location.href = "index.html";
      });
    };
  </script>

  <style>
    body { font-family: 'Rajdhani', sans-serif; background-color: #04070b; }
    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-body { font-family: 'Inter', sans-serif; }

    .tactical-bg {
      background: 
        radial-gradient(circle at 50% 10%, rgba(239, 68, 68, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 85% 60%, rgba(234, 179, 8, 0.14) 0%, transparent 50%),
        linear-gradient(180deg, rgba(4, 7, 13, 0.95) 0%, rgba(2, 4, 7, 0.99) 100%),
        url('https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=2000&q=80');
      background-size: cover; background-position: center; background-attachment: fixed;
    }

    .hud-grid {
      background-image: 
        linear-gradient(rgba(245, 158, 11, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 158, 11, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .armor-panel {
      background: rgba(10, 15, 22, 0.92);
      border: 1px solid rgba(245, 158, 11, 0.25);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>

<body class="tactical-bg hud-grid text-neutral-100 min-h-screen flex flex-col justify-between">

  <!-- TOP HEADER -->
  <header class="w-full pt-6 pb-4 px-4 border-b border-neutral-800/80 bg-black/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-xl bg-black border border-amber-500/80 p-1 shadow-[0_0_20px_rgba(245,158,11,0.3)] shrink-0 flex items-center justify-center">
          <img src="logo.jpeg" alt="Team Phantom Logo" class="w-full h-full object-cover rounded-lg" onerror="this.src='https://via.placeholder.com/150/000000/f59e0b?text=PHANTOM';">
        </div>
        <div>
          <h1 class="font-stencil text-2xl sm:text-4xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-amber-400 to-yellow-300">
            TEAM PHANTOM
          </h1>
          <p class="font-orbitron text-[10px] sm:text-xs text-neutral-400 tracking-widest uppercase">
            TACTICAL LECTURE CONSOLE
          </p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="window.navigateBackToChapters()" class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-neutral-300 text-xs font-orbitron font-bold px-3.5 py-2 rounded-lg uppercase tracking-wider transition cursor-pointer">
          &larr; BACK TO CHAPTERS
        </button>
        <button onclick="window.terminateCadetSession()" class="bg-red-950/80 hover:bg-red-900 border border-red-700/80 text-red-300 text-xs font-orbitron font-bold px-3.5 py-2 rounded-lg uppercase tracking-wider transition cursor-pointer">
          LOGOUT
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN LECTURE SECTION -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    
    <!-- CHAPTER HEADER SUMMARY CARD -->
    <div class="armor-panel rounded-2xl p-5 mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-2.5 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/40 text-[11px] font-orbitron font-bold tracking-wider uppercase mb-1" id="badgeIndicator">
          BRIEFING ARCHIVE
        </div>
        <h2 class="font-stencil text-2xl sm:text-3xl text-white tracking-wide uppercase" id="chapterHeading">
          LOADING CHAPTER...
        </h2>
        <p class="text-xs text-neutral-400 font-body mt-1">
          Access high-definition tactical classes, concept walkthroughs, and official dossier notes below.
        </p>
      </div>
      <div class="flex items-center gap-2 bg-black/60 border border-emerald-500/40 px-3.5 py-2 rounded-xl text-xs font-mono text-emerald-400">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="lectureCountBadge">STREAM READY</span>
      </div>
    </div>

    <!-- LECTURES GRID -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="lecturesContainer"></div>

  </main>

  <!-- FOOTER -->
  <footer class="w-full bg-black/95 border-t border-neutral-900 py-3.5 px-4 text-center">
    <p class="text-[11px] font-body text-neutral-500 tracking-wider">
      &copy; 2026 TEAM PHANTOM. MILITARY PRECISION PROTOCOL.
    </p>
  </footer>
</body>
</html>
