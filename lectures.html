    }
  }, 1000);

  // 4. Console Auto Clear
  setInterval(() => {
    console.clear();
  }, 1500);
})();

    let currentBatch = "capf";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      renderLecturesList();
    });

    function renderLecturesList() {
      const urlParams = new URLSearchParams(window.location.search);
      currentBatch = urlParams.get('batch') || urlParams.get('squadron') || 'capf';
      currentSubject = urlParams.get('subject') || 'Mentor Session';
      const chapterName = urlParams.get('chapter') || 'Briefing Dossier';
      let chapterId = urlParams.get('chapterId') || '';
      const mode = urlParams.get('mode') || 'live';

      // 19 चैप्टर्स और अन्य स्क्वाड्रन के लिए फॉलबैक ID डिटेक्शन
      if (!chapterId || !lectureDatabase[chapterId]) {
        const cleanName = chapterName.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (cleanName.includes('ratio')) chapterId = 'ch-cds-ratio';
        else if (cleanName.includes('average')) chapterId = 'ch-cds-average';
        else if (cleanName.includes('timework') || cleanName.includes('work')) chapterId = 'ch-cds-time-work';
        else if (cleanName.includes('timedist') || (cleanName.includes('distance') && !cleanName.includes('height'))) chapterId = 'ch-cds-time-dist';
        else if (cleanName.includes('percent')) chapterId = 'ch-cds-percent';
        else if (cleanName.includes('profit') || cleanName.includes('loss')) chapterId = 'ch-cds-profit-loss';
        else if (cleanName.includes('interest')) chapterId = 'ch-cds-interest';
        else if (cleanName.includes('number')) chapterId = 'ch-cds-number-system';
        else if (cleanName.includes('simplif')) chapterId = 'ch-cds-simplification';
        else if (cleanName.includes('lcm') || cleanName.includes('hcf')) chapterId = 'ch-cds-lcm-hcf';
        else if (cleanName.includes('equation')) chapterId = 'ch-cds-equations';
        else if (cleanName.includes('algebra')) chapterId = 'ch-cds-algebra';
        else if (cleanName.includes('logarithm') || cleanName.includes('log')) chapterId = 'ch-cds-logarithm';
        else if (cleanName.includes('set')) chapterId = 'ch-cds-sets';
        else if (cleanName.includes('geometr') || cleanName.includes('2d')) chapterId = 'ch-cds-geometry';
        else if (cleanName.includes('mensurat') || cleanName.includes('3d')) chapterId = 'ch-cds-mensuration';
        else if (cleanName.includes('trigono')) chapterId = 'ch-cds-trigonometry';
        else if (cleanName.includes('height')) chapterId = (currentBatch === 'afcat') ? 'ch-afcat-math-03' : 'ch-cds-height-distance';
        else if (cleanName.includes('statist') || cleanName.includes('stats')) chapterId = (currentBatch === 'afcat') ? 'ch-afcat-math-02' : 'ch-cds-statistics';
        else if (cleanName.includes('probab')) chapterId = 'ch-afcat-math-01';
        else if (cleanName.includes('coding') || cleanName.includes('decode')) chapterId = 'ch-afcat-reasoning-02';
        else if (cleanName.includes('intro') || cleanName.includes('anurag')) chapterId = 'ch-afcat-reasoning-01';
        else if (cleanName.includes('security') || cleanName.includes('internal') || cleanName.includes('kashmir')) chapterId = 'ch-capf-internal-security';
      }

      const modeBadge = mode === 'recorded' ? 'RECORDED VAULT' : 'LIVE SQUADRON';
      document.getElementById('badgeIndicator').innerText = `${currentBatch.toUpperCase()} • ${modeBadge} • ${currentSubject.toUpperCase()}`;
      document.getElementById('chapterHeading').innerText = chapterName;

      // मूल स्टैटिक लेक्चर्स लोड होंगे
      const staticLectures = lectureDatabase[chapterId] ? [...lectureDatabase[chapterId]] : [];

      // केवल उसी बैच का लाइव डेटा Firestore से आएगा
      const q = query(
        collection(db, "tactical_curriculum"),
        where("squadron", "==", currentBatch.toLowerCase().trim()),
        where("mode", "==", mode)
      );

      onSnapshot(q, (snapshot) => {
        const dynamicLectures = [];
        const seenVideos = new Set();
        const targetChap = chapterName.toLowerCase().replace(/[^a-z0-9]/g, '');

        snapshot.forEach(docSnap => {
          const d = docSnap.data();
          const dChap = (d.chapter || "").toLowerCase().replace(/[^a-z0-9]/g, '');

          if (dChap && (dChap === targetChap || dChap.includes(targetChap) || targetChap.includes(dChap))) {
            const vUrl = (d.url || d.videoUrl || "").trim();
            const cleanTitle = (d.title || "").trim().toLowerCase();
            const uniqueKey = vUrl || cleanTitle;

            if (!seenVideos.has(uniqueKey)) {
              seenVideos.add(uniqueKey);
              dynamicLectures.push({
                lectureNo: String(d.order || dynamicLectures.length + 1).padStart(2, '0'),
                title: d.title,
                desc: d.desc || "Tactical lecture briefing uploaded via Dispatch Console.",
                duration: d.duration || "HD Session",
                videoId: vUrl,
                pdfUrl: d.pdfUrl || "#",
                order: Number(d.order) || 999
              });
            }
          }
        });

        dynamicLectures.sort((a, b) => a.order - b.order);

        const combined = [...staticLectures];
        dynamicLectures.forEach(dyn => {
          const exists = combined.some(st => (st.title && st.title.toLowerCase() === dyn.title.toLowerCase()) || (st.videoId && st.videoId === dyn.videoId));
          if (!exists) combined.push(dyn);
        });

        displayLectures(combined, chapterName, mode);
      }, (err) => {
        console.warn("Curriculum sync fallback:", err);
        displayLectures(staticLectures, chapterName, mode);
      });
    }

    function displayLectures(lectures, chapterName, mode) {
      const container = document.getElementById('lecturesContainer');
      container.innerHTML = "";
      document.getElementById('lectureCountBadge').innerText = `${lectures.length} SESSIONS READY`;

      if (lectures.length === 0) {
        container.innerHTML = `
          <div class="col-span-full armor-panel rounded-2xl p-12 text-center border border-amber-500/30">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-amber-500/10 text-amber-400 mb-4 text-2xl">
              ⏳
            </div>
            <h3 class="font-orbitron text-lg sm:text-xl text-amber-400 font-bold tracking-wider mb-2 uppercase">
              IT WILL BE UPLOADED VERY SOON
            </h3>
            <p class="text-xs text-neutral-400 font-body max-w-md mx-auto">
              ${mode === 'recorded' ? 'Recorded syllabus dossiers for this module are currently under synchronization.' : `Live lectures for "${chapterName}" are scheduled.`}
            </p>
          </div>
        `;
        return;
      }

      lectures.forEach((lec) => {
        const card = document.createElement('div');
        card.className = "armor-panel rounded-xl p-5 flex flex-col justify-between hover:border-amber-500/60 transition group shadow-lg";

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="px-2.5 py-0.5 rounded bg-black/80 border border-neutral-700 text-amber-400 font-mono text-xs font-bold">
                SESSION #${lec.lectureNo}
              </span>
              <span class="text-[11px] font-mono text-neutral-400 flex items-center gap-1">
                ⏱ ${lec.duration}
              </span>
            </div>
            <h3 class="font-orbitron font-bold text-base text-white group-hover:text-amber-400 transition mb-1.5">
              ${lec.title}
            </h3>
            <p class="text-xs text-neutral-400 font-body leading-relaxed mb-4">
              ${lec.desc}
            </p>
          </div>

          <div class="pt-3 border-t border-neutral-800/80 flex items-center gap-2">
            <button onclick="window.playLectureVideo('${lec.videoId}', '${lec.title.replace(/'/g, "\\'")}')" class="flex-1 py-2 bg-gradient-to-r from-amber-600 to-yellow-500 hover:from-amber-500 hover:to-yellow-400 text-black font-orbitron font-extrabold text-xs rounded-lg uppercase tracking-wider transition shadow cursor-pointer">
              WATCH LECTURE
            </button>
            <button onclick="window.openClassNotes('${lec.pdfUrl}')" class="px-3 py-2 bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-neutral-300 font-orbitron font-bold text-xs rounded-lg uppercase tracking-wider transition cursor-pointer">
              NOTES (PDF)
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // ओरिजिनल सुरक्षित प्ले राउटर
    window.playLectureVideo = function(videoId, title) {
      if (!videoId || videoId === "#" || videoId === "") {
        alert("It will be uploaded very soon.");
        return;
      }
      const cleanTitle = title || "TACTICAL SESSION";
      sessionStorage.setItem("phantom_current_video", videoId);
      sessionStorage.setItem("phantom_current_title", cleanTitle);
      window.location.href = "player.html";
    };

    window.openClassNotes = function(url) {
      if (!url || url === "#" || url === "") {
        alert("Notes dossier: It will be uploaded very soon.");
        return;
      }
      window.open(url, "_blank");
    };

    window.navigateBackToChapters = function() {
      window.history.back();
    };

    window.terminateCadetSession = function() {
      signOut(auth).then(() => {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "index.html";
      });
    };
  </script>
