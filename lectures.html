<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script>
  (() => {
    // 1. Right Click Disable
    document.addEventListener('contextmenu', e => e.preventDefault());

    // 2. Keyboard Shortcuts Block (F12, Inspect, View Source)
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && ['U', 'S', 'P'].includes(e.key.toUpperCase()))
      ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    });

    // 3. DevTools Freezing Trap
    setInterval(() => {
      const start = performance.now();
      debugger;
      const end = performance.now();
      if (end - start > 100) {
        document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:20%;">Security Alert: Developer Tools Detected. Access Denied.</h2>';
      }
    }, 1000);

    // 4. Console Auto Clear
    setInterval(() => {
      console.clear();
    }, 1500);
  })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM | Tactical Lecture Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
    }

    /* Force Full Solid Rich Navy Blue Background */
    html, body {
      background-color: #020617 !important;
      background-image: linear-gradient(135deg, #020617 0%, #081229 50%, #0b1d45 100%) !important;
      color: #f8fafc !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      -webkit-user-select: none;
      user-select: none;
    }

    #starBubbleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; font-weight: 900; }
    .font-body { font-family: 'Inter', sans-serif; font-weight: 700; }

    .phantom-btn {
      transition: all 0.3s ease-in-out;
      position: relative;
    }
    .phantom-btn:hover {
      background-color: #0ea5e9 !important;
      color: #ffffff !important;
      border-color: #38bdf8 !important;
      box-shadow: 0 0 25px #0ea5e9, 0 0 50px #38bdf8, inset 0 0 15px rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }
    .phantom-btn:active { transform: scale(0.96); }

    #phantomStudyTimerWidget {
      position: fixed;
      top: 15px;
      right: 20px;
      z-index: 99999;
      background: rgba(4, 7, 13, 0.95);
      border: 1px solid rgba(255, 215, 0, 0.5);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.25);
      padding: 6px 12px;
      border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(8px);
    }
    #phantomStudyTimerWidget .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #ffd700;
      border-radius: 50%;
      animation: phantomPulse 1.5s infinite;
    }
    @keyframes phantomPulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 10px #ffd700; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    #phantomFocusDock {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99998;
      background: rgba(6, 12, 30, 0.96);
      border: 1px solid rgba(255, 215, 0, 0.5);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
      padding: 8px 18px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: 'Orbitron', sans-serif;
      backdrop-filter: blur(10px);
      font-size: 11px;
      color: #ffd700;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .armor-panel {
      background: rgba(6, 12, 30, 0.96);
      border: 2px solid rgba(255, 215, 0, 0.7);
      box-shadow: 0 0 60px rgba(255, 215, 0, 0.25), inset 0 0 25px rgba(255, 215, 0, 0.15);
      position: relative;
      z-index: 10;
    }

    header, main, footer { position: relative; z-index: 10; }
  </style>
</head>

<body>
  <canvas id="starBubbleCanvas"></canvas>

  <div id="phantomStudyTimerWidget">
    <div class="pulse-dot"></div>
    <div style="font-size: 9px; color: #a3a3a3; text-transform: uppercase; letter-spacing: 1px;">Focus Time:</div>
    <div id="phantomTimerDisplay" style="font-size: 11px; font-weight: bold; color: #ffd700;">00h 00m 00s</div>
  </div>

  <div id="phantomFocusDock">
    <span>🛡️ MISSION MODE: ACTIVE</span>
    <span>|</span>
    <span>⏳ SESSION: <span id="autoPomoDisplay">00:00</span></span>
    <span>|</span>
    <span>🎵 AUDIO: ON</span>
  </div>

  <audio id="ambientAudio" autoplay loop>
    <source src="https://actions.google.com/sounds/v1/weather/rain_heavy.ogg" type="audio/ogg">
  </audio>

  <header class="w-full pt-6 pb-4 px-4 border-b border-amber-500/20 bg-black/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-xl bg-black border border-amber-400 p-1 shadow-[0_0_20px_rgba(255,215,0,0.3)] shrink-0 flex items-center justify-center">
          <img src="logo.jpeg" alt="Team Phantom Logo" class="w-full h-full object-cover rounded-lg" onerror="this.src='https://via.placeholder.com/150/020617/ffd700?text=PHANTOM';">
        </div>
        <div>
          <h1 class="font-stencil text-2xl sm:text-4xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-sky-400 to-amber-300">
            TEAM PHANTOM
          </h1>
          <p class="font-orbitron text-[10px] sm:text-xs text-neutral-400 tracking-widest uppercase">
            TACTICAL LECTURE CONSOLE
          </p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="window.navigateBackToSubjects()" class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-neutral-300 text-xs font-orbitron font-bold px-3.5 py-2 rounded-lg uppercase tracking-wider transition cursor-pointer phantom-btn">
          &larr; BACK TO SUBJECTS
        </button>
        <button onclick="window.terminateCadetSession()" class="bg-red-950/80 hover:bg-red-900 border border-red-700/80 text-red-300 text-xs font-orbitron font-bold px-3.5 py-2 rounded-lg uppercase tracking-wider transition cursor-pointer phantom-btn">
          LOGOUT
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    <!-- Top Header Banner matching Photo 1 exactly -->
    <div class="armor-panel rounded-2xl p-6 mb-8 flex flex-col md:flex-row items-center justify-between gap-6">
      <div class="flex items-center gap-5">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-500 to-amber-400 flex items-center justify-center text-black shadow-lg">
          <i class="fas fa-book-open text-2xl"></i>
        </div>
        <div>
          <div class="flex items-center gap-2 text-cyan-400 font-orbitron text-xs font-bold tracking-widest uppercase mb-1">
            <i class="fas fa-bookmark"></i> SUBJECT
          </div>
          <h2 class="font-stencil text-2xl sm:text-4xl text-white tracking-wide uppercase" id="chapterHeading">
            ENGLISH VOCABULARY
          </h2>
        </div>
      </div>
      <div class="flex flex-col items-end gap-1 text-right">
        <span class="text-xs uppercase tracking-wider font-orbitron text-amber-400">Classes</span>
        <h3 class="text-lg font-bold text-white" id="allClassesTitle">All classes</h3>
        <span class="text-xs text-neutral-400 font-mono" id="lectureCountBadge">5 classes available</span>
      </div>
    </div>

    <!-- Long Rectangular Rows Container matching Photo 1 layout -->
    <div class="flex flex-col gap-4 pb-6" id="lecturesContainer"></div>
  </main>

  <footer class="w-full bg-black/95 border-t border-amber-500/20 py-3.5 px-4 text-center">
    <p class="text-[11px] font-body text-neutral-400 tracking-wider">
      &copy; 2026 TEAM PHANTOM. MILITARY PRECISION PROTOCOL.
    </p>
  </footer>

  <script>
    // Canvas background
    const canvas = document.getElementById("starBubbleCanvas");
    const ctx = canvas.getContext("2d");
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const particles = [];
    for (let i = 0; i < 90; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 4 + 2.5,
        starRadius: Math.random() * 4 + 3,
        speedY: Math.random() * 0.9 + 0.3,
        speedX: (Math.random() - 0.5) * 0.4,
        opacity: Math.random() * 0.9 + 0.4,
        isBubble: Math.random() > 0.45
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y > canvas.height) {
          p.y = -20;
          p.x = Math.random() * canvas.width;
        }
        ctx.beginPath();
        if (p.isBubble) {
          ctx.arc(p.x, p.y, p.radius * 1.5, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(56, 189, 248, ${p.opacity * 0.85})`;
          ctx.lineWidth = 1.6;
          ctx.stroke();
        } else {
          ctx.arc(p.x, p.y, p.starRadius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 223, 0, ${p.opacity})`;
          ctx.shadowBlur = 25;
          ctx.shadowColor = '#ffd700';
          ctx.fill();
        }
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Sample data matching Photo 1 layout: 01 IDIOMS, 02 ONE WORD SUBSTITUTION CLASS 1, 03 ONE WORD SUBSTITUTION CLASS 2
    const sampleLectures = [
      { lectureNo: "01", title: "IDIOMS", duration: "45m", videoId: "https://www.youtube.com/watch?v=dQw4w9WgXcQ", pdfUrl: "#" },
      { lectureNo: "02", title: "ONE WORD SUBSTITUTION CLASS 1", duration: "52m", videoId: "https://www.youtube.com/watch?v=dQw4w9WgXcQ", pdfUrl: "#" },
      { lectureNo: "03", title: "ONE WORD SUBSTITUTION CLASS 2", duration: "1h 05m", videoId: "https://www.youtube.com/watch?v=dQw4w9WgXcQ", pdfUrl: "#" },
      { lectureNo: "04", title: "SYNONYMS & ANTONYMS MASTERCLASS", duration: "58m", videoId: "https://www.youtube.com/watch?v=dQw4w9WgXcQ", pdfUrl: "#" },
      { lectureNo: "05", title: "SPOTTING ERRORS PRACTICE", duration: "50m", videoId: "https://www.youtube.com/watch?v=dQw4w9WgXcQ", pdfUrl: "#" }
    ];

    function renderLectures(lectures) {
      const container = document.getElementById('lecturesContainer');
      container.innerHTML = "";
      document.getElementById('lectureCountBadge').innerText = `${lectures.length} classes available`;

      lectures.forEach((lec, index) => {
        const card = document.createElement('div');
        // Long rectangular row layout with distinct badge colors matching Photo 1
        const badgeColors = [
          'bg-purple-600 text-white',
          'bg-blue-600 text-white',
          'bg-rose-600 text-white',
          'bg-amber-600 text-white',
          'bg-emerald-600 text-white'
        ];
        const colorClass = badgeColors[index % badgeColors.length];

        card.className = "armor-panel rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row items-center justify-between gap-4 hover:border-amber-400 transition group shadow-lg";

        card.innerHTML = `
          <div class="flex items-center gap-4 w-full sm:w-auto">
            <div class="px-4 py-3 rounded-xl font-orbitron font-extrabold text-sm sm:text-base ${colorClass} shadow-md flex flex-col items-center justify-center min-w-[70px]">
              <span class="text-[10px] opacity-80 uppercase">CLASS</span>
              <span>${lec.lectureNo}</span>
            </div>
            <div>
              <h3 class="font-orbitron font-bold text-base sm:text-lg text-white group-hover:text-amber-400 transition">
                ${lec.title}
              </h3>
              ${lec.duration ? `<span class="text-xs font-mono text-neutral-400 flex items-center gap-1 mt-1">⏱ Duration: ${lec.duration}</span>` : ''}
            </div>
          </div>

          <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
            <button onclick="window.playLectureVideo('${lec.videoId}', '${lec.title.replace(/'/g, "\'")}')" class="px-5 py-2.5 bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 hover:from-sky-400 hover:to-sky-300 text-black font-orbitron font-extrabold text-xs rounded-xl uppercase tracking-wider transition shadow cursor-pointer phantom-btn flex items-center gap-2">
              <i class="fas fa-play"></i> Watch
            </button>
            <button onclick="window.openClassNotes('${lec.pdfUrl}')" class="px-4 py-2.5 bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-neutral-200 font-orbitron font-bold text-xs rounded-xl uppercase tracking-wider transition cursor-pointer phantom-btn flex items-center gap-2">
              <i class="fas fa-file-pdf text-blue-400"></i> Notes
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.playLectureVideo = function(videoId, title) {
      sessionStorage.setItem("phantom_current_video", videoId);
      sessionStorage.setItem("phantom_current_title", title);
      window.location.href = "player.html";
    };

    window.openClassNotes = function(url) {
      alert("Opening class notes PDF dossier...");
    };

    window.navigateBackToSubjects = function() {
      window.location.href = "index.html";
    };

    window.terminateCadetSession = function() {
      localStorage.removeItem("phantom_session_token");
      localStorage.removeItem("phantom_uid");
      sessionStorage.clear();
      window.location.href = "index.html";
    };

    renderLectures(sampleLectures);
  </script>
</body>
</html>
