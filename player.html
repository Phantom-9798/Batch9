<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM | Tactical Video Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Military Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #04070b;
      -webkit-user-select: none;
      user-select: none;
    }
    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }

    .tactical-bg {
      background: 
        radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.12) 0%, transparent 50%),
        linear-gradient(180deg, rgba(4, 7, 13, 0.96) 0%, rgba(2, 4, 7, 0.99) 100%);
    }

    .hud-grid {
      background-image: 
        linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .armor-panel {
      background: rgba(10, 15, 22, 0.95);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
    }

    /* मुख्य व्यूकंटेनर */
    #phantomConsoleScreen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      overflow: hidden;
      border-radius: 0.75rem;
    }

    #phantomConsoleScreen:fullscreen,
    #phantomConsoleScreen:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
    }

    /* Nexield Mode (Unchanged & Safe) */
    .nexield-frame {
      position: absolute;
      width: 100% !important;
      height: 106% !important;
      top: -4.2% !important;
      left: 0;
      border: none;
    }

    /* YouTube Clean Engine */
    .yt-box {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #tacticalPlayer {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ऊपर का चैनल नाम और शेयर बटन ब्लॉक करने वाला ब्लैक मास्क */
    .top-anti-share-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      z-index: 25;
      background: linear-gradient(180deg, #04070b 55%, rgba(4, 7, 11, 0) 100%);
      pointer-events: auto;
    }

    /* नीचे YouTube Logo Click Blocker (Settings/Gear और Fullscreen खुले रहेंगे) */
    .bottom-anti-yt-redirect {
      position: absolute;
      bottom: 0;
      right: 50px; /* Gear और Fullscreen को खुला छोड़ता है */
      width: 85px;  /* सिर्फ 'YouTube' लिखे लोगो को ब्लॉक करता है */
      height: 48px;
      z-index: 25;
      background: transparent;
      pointer-events: auto; /* YouTube पर रीडायरेक्ट बंद */
    }

    /* स्क्रीन 10s टैप जोन (Left & Right) */
    .tap-zone {
      position: absolute;
      top: 60px;
      bottom: 50px;
      width: 42%;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .tap-zone-left { left: 0; }
    .tap-zone-right { right: 0; }

    /* 10s स्किप बैज */
    .skip-alert-badge {
      background: rgba(16, 185, 129, 0.9);
      color: #000000;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 900;
      padding: 10px 18px;
      border-radius: 9999px;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.6);
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
    }
    .skip-alert-badge.show {
      opacity: 1;
      transform: scale(1.1);
    }
  </style>
</head>

<body class="tactical-bg hud-grid text-neutral-100 min-h-screen flex flex-col justify-between" oncontextmenu="return false;">

  <!-- TOP HEADER -->
  <header class="w-full pt-6 pb-4 px-4 border-b border-emerald-950/60 bg-black/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <div>
          <h1 class="font-orbitron font-bold text-xs sm:text-sm tracking-wider text-emerald-400 uppercase" id="playerTitle">
            TACTICAL STREAMING CONSOLE
          </h1>
          <p class="text-[10px] text-neutral-400 font-mono">SECURE AIRSPACE FEED</p>
        </div>
      </div>
      <button onclick="window.history.back()" class="bg-neutral-900 hover:bg-neutral-800 border border-emerald-600/40 text-emerald-400 text-xs font-orbitron font-bold px-3.5 py-2 rounded-lg uppercase tracking-wider transition cursor-pointer">
        &larr; BACK TO LECTURES
      </button>
    </div>
  </header>

  <!-- MAIN VIDEO VIEWPORT -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full flex flex-col items-center justify-center">
    <div class="w-full armor-panel rounded-2xl p-2 sm:p-3 overflow-hidden shadow-2xl relative">
      <div id="phantomConsoleScreen">
        <div id="playerRoot" class="w-full h-full relative"></div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full bg-black/95 border-t border-neutral-900 py-3 px-4 text-center">
    <p class="text-[11px] font-mono text-emerald-500/80 tracking-wider">
      &copy; 2026 TEAM PHANTOM &bull; ANTI-LEAK STREAM TERMINAL
    </p>
  </footer>

  <script>
    let ytPlayerInstance = null;

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlVideo = urlParams.get("v") || urlParams.get("stream");
      const urlTitle = urlParams.get("title");

      const storedVideo = sessionStorage.getItem("phantom_current_video");
      const storedTitle = sessionStorage.getItem("phantom_current_title");

      const finalVideo = urlVideo || storedVideo;
      const finalTitle = urlTitle || storedTitle || "TACTICAL SQUADRON CLASS";

      if (finalTitle) {
        document.getElementById("playerTitle").innerText = decodeURIComponent(finalTitle);
      }

      if (!finalVideo) {
        alert("Session error: Video target not found.");
        return;
      }

      const playerRoot = document.getElementById("playerRoot");

      // =========================================================================
      // CASE 1: NEXIELD (VIMEO STREAM) - बिल्कुल वैसा ही, कोई बदलाव नहीं
      // =========================================================================
      if (finalVideo.startsWith("http://") || finalVideo.startsWith("https://")) {
        playerRoot.innerHTML = `
          <iframe 
            src="${finalVideo}" 
            class="nexield-frame" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen="true">
          </iframe>
        `;
      } 
      // =========================================================================
      // CASE 2: YOUTUBE (ORIGINAL SETTINGS + DOUBLE TAP 10s SKIP + ANTI-LEAK)
      // =========================================================================
      else {
        playerRoot.innerHTML = `
          <div class="yt-box">
            <!-- 1. Top Shield: Channel name & Share button hidden & blocked -->
            <div class="top-anti-share-shield"></div>

            <!-- 2. Bottom Shield: YouTube logo redirect blocked -->
            <div class="bottom-anti-yt-redirect"></div>

            <!-- 3. Screen Double Tap Zones (10s Backward / Forward) -->
            <div class="tap-zone tap-zone-left" ondblclick="skipTacticalVideo(-10, 'badgeRewind')">
              <div class="skip-alert-badge" id="badgeRewind">&#171; 10s</div>
            </div>
            
            <div class="tap-zone tap-zone-right" ondblclick="skipTacticalVideo(10, 'badgeForward')">
              <div class="skip-alert-badge" id="badgeForward">10s &#187;</div>
            </div>

            <!-- 4. Iframe with Native Settings (Gear) Enabled for REAL Quality & Speed -->
            <iframe 
              id="tacticalPlayer" 
              src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(finalVideo)}?autoplay=1&controls=1&rel=0&modestbranding=1&enablejsapi=1&iv_load_policy=3" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" 
              allowfullscreen="true">
            </iframe>
          </div>
        `;

        // YouTube postMessage API listener for skipping
        window.addEventListener('message', (event) => {
          // Track iframe state if needed
        });
      }
    });

    // 10-Second Skip Handler (Double-Click on Screen)
    function skipTacticalVideo(seconds, badgeId) {
      const iframe = document.getElementById("tacticalPlayer");
      if (!iframe || !iframe.contentWindow) return;

      // Show animated tactical badge
      const badge = document.getElementById(badgeId);
      if (badge) {
        badge.classList.add('show');
        setTimeout(() => badge.classList.remove('show'), 550);
      }

      // YouTube player ko direct seek message bhejna
      iframe.contentWindow.postMessage(JSON.stringify({
        event: 'command',
        func: seconds > 0 ? 'fastForward' : 'rewind',
        args: [Math.abs(seconds)]
      }), '*');

      // Fallback relative seek command
      iframe.contentWindow.postMessage(JSON.stringify({
        event: 'listening',
        id: 1
      }), '*');
    }

    // Disable Inspect Shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "U")) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
