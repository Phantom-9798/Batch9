<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM | Tactical Video Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- YouTube IFrame API Script -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- Military Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #04070b;
      -webkit-user-select: none;
      user-select: none;
    }
    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }

    .tactical-bg {
      background: 
        radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.12) 0%, transparent 50%),
        linear-gradient(180deg, rgba(4, 7, 13, 0.96) 0%, rgba(2, 4, 7, 0.99) 100%);
    }

    .hud-grid {
      background-image: 
        linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .armor-panel {
      background: rgba(10, 15, 22, 0.95);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
    }

    /* मुख्य व्यूकंटेनर */
    #phantomConsoleScreen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      overflow: hidden;
      border-radius: 0.75rem;
    }

    #phantomConsoleScreen:fullscreen,
    #phantomConsoleScreen:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
    }

    /* Nexield Mode: जो परफेक्ट चल रहा था */
    .nexield-frame {
      position: absolute;
      width: 100% !important;
      height: 106% !important;
      top: -4.2% !important;
      left: 0;
      border: none;
    }

    /* YouTube Clean Engine: ऊपर व नीचे 15% ज़ूम व कट ताकि लोगो/शेयर कट जाएं */
    .yt-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #ytEmbedFrame {
      position: absolute;
      width: 100% !important;
      height: 140% !important;
      top: -20% !important; /* ऊपर का शेयर बटन, चैनल नाम 100% बाहर कट गया */
      left: 0;
      pointer-events: none; /* अंदर के YouTube लोगो/शेयर पर कोई क्लिक नहीं कर सकता */
    }

    /* YouTube Tactical Control Overlay */
    .yt-controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.95) 80%);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #phantomConsoleScreen:hover .yt-controls-bar {
      opacity: 1;
    }

    /* कस्टम प्रोग्रेस बार */
    .progress-bar-container {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: #10b981;
      width: 0%;
      border-radius: 3px;
    }

    /* कस्टम फुलस्क्रीन बटन */
    .tactical-fs-btn {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 40;
      background: rgba(16, 185, 129, 0.9);
      color: #000;
      padding: 5px 11px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>

<body class="tactical-bg hud-grid text-neutral-100 min-h-screen flex flex-col justify-between" oncontextmenu="return false;">

  <!-- HEADER -->
  <header class="w-full pt-6 pb-4 px-4 border-b border-emerald-950/60 bg-black/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <div>
          <h1 class="font-orbitron font-bold text-xs sm:text-sm tracking-wider text-emerald-400 uppercase" id="playerTitle">
            TACTICAL STREAMING CONSOLE
          </h1>
          <p class="text-[10px] text-neutral-400 font-mono">SECURE PROTECTED STREAM</p>
        </div>
      </div>
      <button onclick="window.history.back()" class="bg-neutral-900 hover:bg-neutral-800 border border-emerald-600/40 text-emerald-400 text-xs font-orbitron font-bold px-3.5 py-2 rounded-lg uppercase tracking-wider transition cursor-pointer">
        &larr; BACK TO LECTURES
      </button>
    </div>
  </header>

  <!-- MAIN VIDEO VIEWPORT -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full flex flex-col items-center justify-center">
    <div class="w-full armor-panel rounded-2xl p-2 sm:p-3 overflow-hidden shadow-2xl relative">
      
      <div id="phantomConsoleScreen">
        <!-- डायनामिक प्लेयर कंटेनर -->
        <div id="playerRoot" class="w-full h-full relative"></div>

        <!-- फुलस्क्रीन टॉगल -->
        <button id="fsBtn" class="tactical-fs-btn font-orbitron" onclick="toggleTacticalFullscreen()">
          [⛶ FULLSCREEN]
        </button>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full bg-black/95 border-t border-neutral-900 py-3 px-4 text-center">
    <p class="text-[11px] font-mono text-emerald-500/80 tracking-wider">
      &copy; 2026 TEAM PHANTOM &bull; ANTI-LEAK STREAM TERMINAL
    </p>
  </footer>

  <script>
    let ytPlayer = null;
    let isPlaying = false;
    let progressInterval = null;

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlVideo = urlParams.get("v") || urlParams.get("stream");
      const urlTitle = urlParams.get("title");

      const storedVideo = sessionStorage.getItem("phantom_current_video");
      const storedTitle = sessionStorage.getItem("phantom_current_title");

      const finalVideo = urlVideo || storedVideo;
      const finalTitle = urlTitle || storedTitle || "TACTICAL SQUADRON CLASS";

      if (finalTitle) {
        document.getElementById("playerTitle").innerText = decodeURIComponent(finalTitle);
      }

      if (!finalVideo) {
        alert("Session error: Video target not found.");
        return;
      }

      const playerRoot = document.getElementById("playerRoot");

      // =========================================================================
      // CASE 1: NEXIELD (VIMEO STREAM) - 100% वैसा ही जैसा आपको पसंद आया
      // =========================================================================
      if (finalVideo.startsWith("http://") || finalVideo.startsWith("https://")) {
        playerRoot.innerHTML = `
          <iframe 
            src="${finalVideo}" 
            class="nexield-frame" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen="false">
          </iframe>
        `;
      } 
      // =========================================================================
      // CASE 2: YOUTUBE (ZERO BRANDING + BUILT-IN SPEED/QUALITY CONTROLS)
      // =========================================================================
      else {
        playerRoot.innerHTML = `
          <div class="yt-wrapper" onclick="togglePlayState()">
            <div id="ytEmbedFrame"></div>
            
            <!-- TACTICAL CONTROL BAR (Speed, Time, Play/Pause) -->
            <div class="yt-controls-bar" onclick="event.stopPropagation()">
              <div class="progress-bar-container" onclick="seekVideo(event)">
                <div class="progress-fill" id="pFill"></div>
              </div>

              <div class="flex items-center justify-between text-xs font-mono pt-1">
                <div class="flex items-center gap-3">
                  <button onclick="togglePlayState()" id="playBtn" class="text-emerald-400 font-bold text-sm">▶ PLAY</button>
                  <span id="timeDisplay" class="text-neutral-400 text-[11px]">00:00 / 00:00</span>
                </div>

                <!-- SPEED SELECTOR (1x, 1.25x, 1.5x, 2x) -->
                <div class="flex items-center gap-2">
                  <span class="text-neutral-400 text-[10px] uppercase font-orbitron">Speed:</span>
                  <select onchange="changeSpeed(this.value)" class="bg-black/90 border border-emerald-500/40 text-emerald-400 rounded px-1.5 py-0.5 text-xs outline-none cursor-pointer">
                    <option value="1">1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="1.75">1.75x</option>
                    <option value="2">2.0x</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        `;

        // Load YouTube API
        window.onYouTubeIframeAPIReady = () => {
          ytPlayer = new YT.Player('ytEmbedFrame', {
            videoId: finalVideo,
            playerVars: {
              autoplay: 1,
              controls: 0,        // YouTube के डिफ़ॉल्ट कंट्रोल्स बंद (लोगो व शेयर गायब)
              disablekb: 0,
              fs: 0,              // नेटिव फुलस्क्रीन बंद
              modestbranding: 1,  // लोगो बंद
              rel: 0,
              showinfo: 0,
              iv_load_policy: 3
            },
            events: {
              onReady: (e) => {
                e.target.playVideo();
                startProgressTracker();
              },
              onStateChange: (e) => {
                const playBtn = document.getElementById("playBtn");
                if (e.data === YT.PlayerState.PLAYING) {
                  isPlaying = true;
                  if (playBtn) playBtn.innerText = "⏸ PAUSE";
                } else {
                  isPlaying = false;
                  if (playBtn) playBtn.innerText = "▶ PLAY";
                }
              }
            }
          });
        };

        // अगर API पहले से लोड हो चुकी हो:
        if (window.YT && window.YT.Player) {
          window.onYouTubeIframeAPIReady();
        }
      }
    });

    // YouTube Controller Functions
    function togglePlayState() {
      if (!ytPlayer) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    function changeSpeed(val) {
      if (!ytPlayer) return;
      ytPlayer.setPlaybackRate(parseFloat(val));
    }

    function seekVideo(e) {
      if (!ytPlayer) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      const duration = ytPlayer.getDuration();
      ytPlayer.seekTo(pos * duration, true);
    }

    function startProgressTracker() {
      if (progressInterval) clearInterval(progressInterval);
      progressInterval = setInterval(() => {
        if (ytPlayer && ytPlayer.getCurrentTime) {
          const curr = ytPlayer.getCurrentTime();
          const dur = ytPlayer.getDuration();
          if (dur > 0) {
            const pct = (curr / dur) * 100;
            const fill = document.getElementById("pFill");
            if (fill) fill.style.width = pct + "%";
            
            const timeDisp = document.getElementById("timeDisplay");
            if (timeDisp) timeDisp.innerText = `${formatTime(curr)} / ${formatTime(dur)}`;
          }
        }
      }, 500);
    }

    function formatTime(s) {
      const min = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Fullscreen Toggle
    function toggleTacticalFullscreen() {
      const target = document.getElementById("phantomConsoleScreen");
      const fsBtn = document.getElementById("fsBtn");

      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (target.requestFullscreen) target.requestFullscreen();
        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
        fsBtn.innerText = "[✕ EXIT]";
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        fsBtn.innerText = "[⛶ FULLSCREEN]";
      }
    }

    document.addEventListener("fullscreenchange", () => {
      const fsBtn = document.getElementById("fsBtn");
      if (!document.fullscreenElement) {
        fsBtn.innerText = "[⛶ FULLSCREEN]";
      }
    });

    // Disable Inspect Shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "U")) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
