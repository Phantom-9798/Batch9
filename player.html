<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM | Tactical Video Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- YouTube IFrame API Script -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- Military Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #04070b;
      -webkit-user-select: none;
      user-select: none;
    }
    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }

    .tactical-bg {
      background: 
        radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.12) 0%, transparent 50%),
        linear-gradient(180deg, rgba(4, 7, 13, 0.96) 0%, rgba(2, 4, 7, 0.99) 100%);
    }

    .hud-grid {
      background-image: 
        linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .armor-panel {
      background: rgba(10, 15, 22, 0.95);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
    }

    /* मुख्य व्यूकंटेनर */
    #phantomConsoleScreen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      overflow: hidden;
      border-radius: 0.75rem;
    }

    #phantomConsoleScreen:fullscreen,
    #phantomConsoleScreen:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
    }

    /* Nexield Mode: जो पहले से बिल्कुल सही चल रहा है */
    .nexield-frame {
      position: absolute;
      width: 100% !important;
      height: 106% !important;
      top: -4.2% !important;
      left: 0;
      border: none;
    }

    /* YouTube Clean Engine: ऊपर व नीचे से कट ताकि लोगो व शेयर बाहर रहें */
    .yt-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #ytEmbedFrame {
      position: absolute;
      width: 100% !important;
      height: 140% !important;
      top: -20% !important;
      left: 0;
      pointer-events: none;
    }

    /* स्क्रीन के बिल्कुल बीच का फुलस्क्रीन बटन (Hover करने पर स्मूथली दिखेगा) */
    .center-fs-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 45;
      background: rgba(16, 185, 129, 0.9);
      color: #000;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }

    #phantomConsoleScreen:hover .center-fs-btn {
      opacity: 1;
      pointer-events: auto;
    }

    .center-fs-btn:hover {
      background: #10b981;
      transform: translate(-50%, -50%) scale(1.08);
    }

    /* नीचे का क्लीन टैक्टिकल कंट्रोल बार */
    .yt-controls-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(180deg, transparent 0%, rgba(4, 7, 11, 0.96) 75%);
      padding: 10px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 50;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    #phantomConsoleScreen:hover .yt-controls-bar {
      opacity: 1;
    }

    /* प्रोग्रेस बार */
    .progress-bar-container {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: #10b981;
      width: 0%;
      border-radius: 3px;
    }
  </style>
</head>

<body class="tactical-bg hud-grid text-neutral-100 min-h-screen flex flex-col justify-between" oncontextmenu="return false;">

  <!-- HEADER -->
  <header class="w-full pt-6 pb-4 px-4 border-b border-emerald-950/60 bg-black/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <div>
          <h1 class="font-orbitron font-bold text-xs sm:text-sm tracking-wider text-emerald-400 uppercase" id="playerTitle">
            TACTICAL STREAMING CONSOLE
          </h1>
          <p class="text-[10px] text-neutral-400 font-mono">SECURE AIRSPACE FEED</p>
        </div>
      </div>
      <button onclick="window.history.back()" class="bg-neutral-900 hover:bg-neutral-800 border border-emerald-600/40 text-emerald-400 text-xs font-orbitron font-bold px-3.5 py-2 rounded-lg uppercase tracking-wider transition cursor-pointer">
        &larr; BACK TO LECTURES
      </button>
    </div>
  </header>

  <!-- MAIN VIDEO VIEWPORT -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full flex flex-col items-center justify-center">
    <div class="w-full armor-panel rounded-2xl p-2 sm:p-3 overflow-hidden shadow-2xl relative">
      
      <div id="phantomConsoleScreen">
        <!-- 1. सेंटर में फुलस्क्रीन बटन (स्क्रीन के बीचों-बीच) -->
        <button id="centerFsBtn" class="center-fs-btn font-orbitron" onclick="toggleTacticalFullscreen()">
          [⛶ FULLSCREEN]
        </button>

        <!-- 2. डायनामिक वीडियो एरिया -->
        <div id="playerRoot" class="w-full h-full relative"></div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full bg-black/95 border-t border-neutral-900 py-3 px-4 text-center">
    <p class="text-[11px] font-mono text-emerald-500/80 tracking-wider">
      &copy; 2026 TEAM PHANTOM &bull; ANTI-LEAK STREAM TERMINAL
    </p>
  </footer>

  <script>
    let ytPlayer = null;
    let isPlaying = false;
    let progressInterval = null;

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlVideo = urlParams.get("v") || urlParams.get("stream");
      const urlTitle = urlParams.get("title");

      const storedVideo = sessionStorage.getItem("phantom_current_video");
      const storedTitle = sessionStorage.getItem("phantom_current_title");

      const finalVideo = urlVideo || storedVideo;
      const finalTitle = urlTitle || storedTitle || "TACTICAL SQUADRON CLASS";

      if (finalTitle) {
        document.getElementById("playerTitle").innerText = decodeURIComponent(finalTitle);
      }

      if (!finalVideo) {
        alert("Session error: Video target not found.");
        return;
      }

      const playerRoot = document.getElementById("playerRoot");

      // =========================================================================
      // CASE 1: NEXIELD (VIMEO STREAM) - बिल्कुल अनटच्ड और सेफ
      // =========================================================================
      if (finalVideo.startsWith("http://") || finalVideo.startsWith("https://")) {
        playerRoot.innerHTML = `
          <iframe 
            src="${finalVideo}" 
            class="nexield-frame" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen="false">
          </iframe>
        `;
      } 
      // =========================================================================
      // CASE 2: YOUTUBE (ZERO LOGO, ZERO SHARE, WITH SPEED & QUALITY TOGGLES)
      // =========================================================================
      else {
        playerRoot.innerHTML = `
          <div class="yt-wrapper" onclick="togglePlayState()">
            <div id="ytEmbedFrame"></div>
            
            <!-- TACTICAL HUD CONTROLS (Aligned without Overlapping) -->
            <div class="yt-controls-bar" onclick="event.stopPropagation()">
              
              <!-- Progress Bar -->
              <div class="progress-bar-container" onclick="seekVideo(event)">
                <div class="progress-fill" id="pFill"></div>
              </div>

              <!-- Controls Row -->
              <div class="flex items-center justify-between text-xs font-mono pt-1">
                
                <!-- Left: Play/Pause & Duration -->
                <div class="flex items-center gap-3">
                  <button onclick="togglePlayState()" id="playBtn" class="text-emerald-400 font-bold text-xs uppercase px-2 py-1 bg-black/60 rounded border border-emerald-600/30">
                    ▶ PLAY
                  </button>
                  <span id="timeDisplay" class="text-neutral-400 text-[11px]">00:00 / 00:00</span>
                </div>

                <!-- Right: Speed, Quality & Mini-Fullscreen (Sab Ek Saath) -->
                <div class="flex items-center gap-2">
                  
                  <!-- SPEED SELECTOR -->
                  <div class="flex items-center gap-1">
                    <span class="text-neutral-400 text-[10px] font-orbitron">SPD:</span>
                    <select onchange="changeSpeed(this.value)" class="bg-black/90 border border-emerald-500/40 text-emerald-400 rounded px-1.5 py-0.5 text-[11px] outline-none cursor-pointer">
                      <option value="1">1.0x</option>
                      <option value="1.25">1.25x</option>
                      <option value="1.5">1.5x</option>
                      <option value="1.75">1.75x</option>
                      <option value="2">2.0x</option>
                    </select>
                  </div>

                  <!-- QUALITY SELECTOR -->
                  <div class="flex items-center gap-1">
                    <span class="text-neutral-400 text-[10px] font-orbitron">QUAL:</span>
                    <select onchange="changeQuality(this.value)" class="bg-black/90 border border-emerald-500/40 text-emerald-400 rounded px-1.5 py-0.5 text-[11px] outline-none cursor-pointer">
                      <option value="auto">Auto</option>
                      <option value="hd1080">1080p</option>
                      <option value="hd720">720p</option>
                      <option value="large">480p</option>
                      <option value="medium">360p</option>
                    </select>
                  </div>

                  <!-- MINI FULLSCREEN BUTTON (Bar ke andar) -->
                  <button onclick="toggleTacticalFullscreen()" class="ml-1 px-2.5 py-0.5 bg-emerald-600 hover:bg-emerald-500 text-black text-[10px] font-orbitron font-extrabold rounded tracking-wider cursor-pointer">
                    [⛶]
                  </button>

                </div>
              </div>
            </div>
          </div>
        `;

        // Initialize YouTube Engine
        window.onYouTubeIframeAPIReady = () => {
          ytPlayer = new YT.Player('ytEmbedFrame', {
            videoId: finalVideo,
            playerVars: {
              autoplay: 1,
              controls: 0,
              disablekb: 0,
              fs: 0,
              modestbranding: 1,
              rel: 0,
              showinfo: 0,
              iv_load_policy: 3
            },
            events: {
              onReady: (e) => {
                e.target.playVideo();
                startProgressTracker();
              },
              onStateChange: (e) => {
                const playBtn = document.getElementById("playBtn");
                if (e.data === YT.PlayerState.PLAYING) {
                  isPlaying = true;
                  if (playBtn) playBtn.innerText = "⏸ PAUSE";
                } else {
                  isPlaying = false;
                  if (playBtn) playBtn.innerText = "▶ PLAY";
                }
              }
            }
          });
        };

        if (window.YT && window.YT.Player) {
          window.onYouTubeIframeAPIReady();
        }
      }
    });

    // YouTube Handlers
    function togglePlayState() {
      if (!ytPlayer) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    function changeSpeed(val) {
      if (!ytPlayer) return;
      ytPlayer.setPlaybackRate(parseFloat(val));
    }

    function changeQuality(val) {
      if (!ytPlayer) return;
      if (val === 'auto') {
        ytPlayer.setPlaybackQuality('default');
      } else {
        ytPlayer.setPlaybackQuality(val);
      }
    }

    function seekVideo(e) {
      if (!ytPlayer) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      const duration = ytPlayer.getDuration();
      ytPlayer.seekTo(pos * duration, true);
    }

    function startProgressTracker() {
      if (progressInterval) clearInterval(progressInterval);
      progressInterval = setInterval(() => {
        if (ytPlayer && ytPlayer.getCurrentTime) {
          const curr = ytPlayer.getCurrentTime();
          const dur = ytPlayer.getDuration();
          if (dur > 0) {
            const pct = (curr / dur) * 100;
            const fill = document.getElementById("pFill");
            if (fill) fill.style.width = pct + "%";
            
            const timeDisp = document.getElementById("timeDisplay");
            if (timeDisp) timeDisp.innerText = `${formatTime(curr)} /${formatTime(dur)}`;
          }
        }
      }, 500);
    }

    function formatTime(s) {
      const min = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Tactical Fullscreen Controller
    function toggleTacticalFullscreen() {
      const target = document.getElementById("phantomConsoleScreen");
      const centerBtn = document.getElementById("centerFsBtn");

      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (target.requestFullscreen) target.requestFullscreen();
        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
        if (centerBtn) centerBtn.innerText = "[✕ EXIT]";
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        if (centerBtn) centerBtn.innerText = "[⛶ FULLSCREEN]";
      }
    }

    document.addEventListener("fullscreenchange", () => {
      const centerBtn = document.getElementById("centerFsBtn");
      if (!document.fullscreenElement && centerBtn) {
        centerBtn.innerText = "[⛶ FULLSCREEN]";
      }
    });

    // Disable Inspect Shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "U")) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
