<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM | Tactical Video Console</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase v10 Modular SDK for Realtime Single-Device Guard -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3RVHxAfzduyURhBYafmDKyUjVdUQXYtk",
      authDomain: "team-phantom-enrollment.firebaseapp.com",
      projectId: "team-phantom-enrollment",
      storageBucket: "team-phantom-enrollment.firebasestorage.app",
      messagingSenderId: "658049687096",
      appId: "1:658049687096:web:8464788a43126a6bced0cd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let unsubscribeSnapshot = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        window.location.href = "index.html";
        return;
      }

      unsubscribeSnapshot = onSnapshot(doc(db, "cadets", user.uid), (docSnap) => {
        if (!docSnap.exists()) {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          signOut(auth).then(() => window.location.href = "index.html");
          return;
        }

        const data = docSnap.data();
        const localToken = localStorage.getItem("phantom_session_token");

        // Account status check
        if (data.status !== "active") {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          pauseActiveStreams();
          alert("Notice: Cadet account is currently not active or pending verification.");
          signOut(auth).then(() => window.location.href = "index.html");
          return;
        }

        // Single device session token mismatch check
        if (data.activeSession && localToken && data.activeSession !== localToken) {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          pauseActiveStreams();
          alert("SECURITY PROTOCOL: Active session detected on another terminal. Logging out.");
          signOut(auth).then(() => {
            localStorage.removeItem("phantom_session_token");
            localStorage.removeItem("phantom_uid");
            window.location.href = "index.html";
          });
          return;
        }
      });
    });

    function pauseActiveStreams() {
      if (window.ytPlayerInstance && typeof window.ytPlayerInstance.pauseVideo === 'function') {
        window.ytPlayerInstance.pauseVideo();
      }
      const streamFrame = document.getElementById('tacticalFrame');
      if (streamFrame) streamFrame.src = "about:blank";
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #04070b;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .armor-panel {
      background: rgba(10, 15, 22, 0.95);
      border: 1px solid rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
    }

    /* YouTube Crop container for legacy mode */
    .iframe-crop {
      position: absolute;
      top: -65px;
      left: 0;
      width: 100%;
      height: calc(100% + 130px);
      pointer-events: none;
    }
    .iframe-crop iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .gesture-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 60px);
      display: flex;
      z-index: 20;
    }
    .tap-zone { flex: 1; height: 100%; position: relative; cursor: pointer; }
    .tap-indicator {
      position: absolute;
      top: 50%;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(245, 158, 11, 0.6);
      color: #f59e0b;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .left-indicator { left: 25%; transform: translate(-50%, -50%) scale(0.8); }
    .right-indicator { right: 25%; transform: translate(50%, -50%) scale(0.8); }
    .left-indicator.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .right-indicator.show { opacity: 1; transform: translate(50%, -50%) scale(1); }

    .custom-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 56px;
      background: linear-gradient(180deg, rgba(10,15,28,0.94) 0%, rgba(5,8,17,1) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 16px 8px 16px;
      z-index: 50;
      border-top: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
    }
    .seek-container {
      position: relative;
      width: 100%;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .seek-track {
      position: relative;
      width: 100%;
      height: 5px;
      background: rgba(255,255,255,0.22);
      border-radius: 3px;
      transition: height 0.15s ease;
    }
    .seek-container:hover .seek-track { height: 8px; }
    .seek-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: #f59e0b;
      border-radius: 3px;
      pointer-events: none;
    }
    .seek-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%) scale(0);
      width: 14px;
      height: 14px;
      background: #fff;
      border: 2px solid #f59e0b;
      border-radius: 50%;
      pointer-events: none;
      transition: transform 0.15s ease;
    }
    .seek-container:hover .seek-thumb { transform: translate(-50%, -50%) scale(1); }
    .btn {
      background: none;
      border: none;
      color: #e5e7eb;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(255,255,255,0.12); color: #f59e0b; }
    select.hud-select {
      background: #111827;
      color: #f59e0b;
      border: 1px solid #374151;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      outline: none;
    }
  </style>
</head>

<body class="p-4 sm:p-6" oncontextmenu="return false;">

  <!-- TOP HEADER -->
  <header class="max-w-5xl mx-auto w-full flex items-center justify-between mb-4 pb-3 border-b border-neutral-800">
    <div class="flex items-center gap-3">
      <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
      <div>
        <h1 class="font-stencil text-lg sm:text-xl text-amber-400 tracking-wider" id="lectureTitle">
          OPERATIONAL BRIEFING
        </h1>
        <p class="font-orbitron text-[10px] text-neutral-400 uppercase tracking-widest">
          TACTICAL SECURE CONSOLE
        </p>
      </div>
    </div>
    <button onclick="window.history.back()" class="px-4 py-2 rounded-lg bg-neutral-900 border border-neutral-700 hover:border-amber-500 font-orbitron text-xs text-neutral-200 transition cursor-pointer">
      &larr; BACK TO LECTURES
    </button>
  </header>

  <!-- MAIN VIDEO DISPLAY SECTION -->
  <main class="max-w-5xl mx-auto w-full flex-grow flex items-center justify-center">
    
    <!-- 1. DIRECT STREAM ENGINE (FOR VIMEO/NEXIELD EMBEDS) -->
    <div id="directStreamEngine" class="w-full armor-panel rounded-2xl p-2 sm:p-3 overflow-hidden hidden">
      <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-black shadow-inner">
        <iframe 
          id="tacticalFrame"
          src="" 
          class="w-full h-full border-0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- 2. CUSTOM YOUTUBE ENGINE (FOR LEGACY LINKS) -->
    <div id="youtubeEngine" class="relative w-full aspect-video rounded-xl bg-black overflow-hidden border border-neutral-800 shadow-2xl hidden">
      <div class="gesture-layer">
        <div class="tap-zone" id="leftZone">
          <div class="tap-indicator left-indicator" id="leftFeedback">&#8634; 10s</div>
        </div>
        <div class="tap-zone" id="rightZone">
          <div class="tap-indicator right-indicator" id="rightFeedback">&#8635; 10s</div>
        </div>
      </div>

      <div class="iframe-crop">
        <div id="ytPlayer"></div>
      </div>

      <div class="custom-controls">
        <div class="seek-container" id="seekContainer">
          <div class="seek-track">
            <div class="seek-progress" id="seekProgress"></div>
            <div class="seek-thumb" id="seekThumb"></div>
          </div>
        </div>

        <div class="flex items-center justify-between w-full">
          <div class="flex items-center gap-3">
            <button class="btn" id="playBtn">▶ Play</button>
            <button class="btn" id="rewindBtn" title="Rewind 10s">&#8634; 10s</button>
            <button class="btn" id="forwardBtn" title="Forward 10s">&#8635; 10s</button>
            <span class="text-xs text-neutral-400 font-mono" id="timeDisplay">00:00 / 00:00</span>
          </div>

          <div class="flex items-center gap-3">
            <label for="speedSelect" class="text-xs text-neutral-400">Speed:</label>
            <select class="hud-select" id="speedSelect">
              <option value="0.75">0.75x</option>
              <option value="1" selected>1.0x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2.0x</option>
            </select>
            <button class="btn" id="muteBtn">🔊</button>
            <button class="btn" id="fsBtn" title="Fullscreen">&#x26F6;</button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="w-full text-center py-4 text-[11px] font-mono text-neutral-500">
    TEAM PHANTOM TACTICAL NETWORK &bull; ENCRYPTED TRANSMISSION PROTOCOL
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const lectureTitle = urlParams.get('title') || 'OPERATIONAL BRIEFING';
    const streamParam = urlParams.get('stream');
    const youtubeParam = urlParams.get('v');

    document.getElementById('lectureTitle').innerText = lectureTitle;

    const directEngine = document.getElementById('directStreamEngine');
    const ytEngine = document.getElementById('youtubeEngine');

    // Default Fallback Encoded Stream
    const defaultEncodedStream = "aHR0cHM6Ly92aW1wZC5uZXhpZWxkLmluLz90aXRsZT0xLiUyMFByb2JhYmlsaXR5JTIwQ2xhc3MlMjAxJmxpbms9MjFiMmM4Y2E4MDVmYzY5NjFhMWMxM2Y5OTRiZWM5Y2Q5MDg5OTI2Y2YzZDc4Y2Y5ZGRiMGRjYzZlODM4MWI1ODdiODFiMTA5NDczOGQyMzlhYjdkMjYzNWE1YTA3OWRjYjdjMGJlOGI3ODcyYjFjYjVhNTVkOWY0ZmFkMjBjMWZlZWQzMmJlMzNmOWQzZjVlNzJmY2Y3ZDdhZWE3ZmI1Y2M5ZTg4M2IzMzE3NWI3MjMwNDBlYzI3ZGFlMjFiYTY0NjJjZDVhOWQ2NjgyN2IwNWE5N2Q1MDhhYzQ5NWVmZTczZGJhOTY1NWFhMjMwMjc4MzcyOGFjYmZiNTNkYjk2OTM1YjI5M2JlMWJjYjcxZTI1NGM2ZjI0NTY5MWFkNjdhYjNiMWUyNmJkMjA4YzU1NzkxYzY3NzA0OWU2ZTE4NDFiYTlmODYxNTAxZWQyNDI2MWYzMzNhN2VkM2MzZWZkMw==";

    // Route based on parameter type
    if (streamParam) {
      directEngine.classList.remove('hidden');
      document.getElementById('tacticalFrame').src = decodeURIComponent(streamParam);
    } else if (youtubeParam) {
      ytEngine.classList.remove('hidden');
      initYouTubeEngine(youtubeParam);
    } else {
      // Default: Load secured stream console
      directEngine.classList.remove('hidden');
      document.getElementById('tacticalFrame').src = atob(defaultEncodedStream);
    }

    // YOUTUBE ENGINE CONTROLLER
    function initYouTubeEngine(vidId) {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      window.ytPlayerInstance = null;
      let isReady = false;
      let updateTimer = null;
      let isDraggingSeek = false;

      window.onYouTubeIframeAPIReady = function() {
        window.ytPlayerInstance = new YT.Player('ytPlayer', {
          videoId: vidId,
          playerVars: { autoplay: 1, controls: 0, rel: 0, enablejsapi: 1, playsinline: 1 },
          events: {
            onReady: (event) => {
              isReady = true;
              try { event.target.playVideo(); } catch(e){}
              updateTimer = setInterval(updateProgress, 300);
            },
            onStateChange: (event) => {
              const playBtn = document.getElementById('playBtn');
              playBtn.innerText = (event.data === YT.PlayerState.PLAYING) ? '⏸ Pause' : '▶ Play';
            }
          }
        });
      };

      function togglePlay() {
        if (!window.ytPlayerInstance || !isReady) return;
        const state = window.ytPlayerInstance.getPlayerState();
        if (state === YT.PlayerState.PLAYING) window.ytPlayerInstance.pauseVideo();
        else window.ytPlayerInstance.playVideo();
      }
      document.getElementById('playBtn').addEventListener('click', togglePlay);

      function skipTime(sec) {
        if (!window.ytPlayerInstance || !isReady) return;
        const cur = window.ytPlayerInstance.getCurrentTime() || 0;
        window.ytPlayerInstance.seekTo(Math.max(cur + sec, 0), true);
      }
      document.getElementById('rewindBtn').addEventListener('click', () => skipTime(-10));
      document.getElementById('forwardBtn').addEventListener('click', () => skipTime(10));

      // Gesture Zones
      let leftTapCount = 0, rightTapCount = 0, leftTapTimer = null, rightTapTimer = null;
      const leftZone = document.getElementById('leftZone');
      const rightZone = document.getElementById('rightZone');

      leftZone.addEventListener('click', (e) => {
        e.stopPropagation();
        leftTapCount++;
        if (leftTapCount === 1) {
          leftTapTimer = setTimeout(() => { togglePlay(); leftTapCount = 0; }, 260);
        } else if (leftTapCount === 2) {
          clearTimeout(leftTapTimer);
          skipTime(-10);
          showIndicator('leftFeedback');
          leftTapCount = 0;
        }
      });

      rightZone.addEventListener('click', (e) => {
        e.stopPropagation();
        rightTapCount++;
        if (rightTapCount === 1) {
          rightTapTimer = setTimeout(() => { togglePlay(); rightTapCount = 0; }, 260);
        } else if (rightTapCount === 2) {
          clearTimeout(rightTapTimer);
          skipTime(10);
          showIndicator('rightFeedback');
          rightTapCount = 0;
        }
      });

      function showIndicator(id) {
        const el = document.getElementById(id);
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 500);
      }

      document.getElementById('speedSelect').addEventListener('change', (e) => {
        if (window.ytPlayerInstance && isReady) {
          window.ytPlayerInstance.setPlaybackRate(parseFloat(e.target.value));
        }
      });

      const muteBtn = document.getElementById('muteBtn');
      muteBtn.addEventListener('click', () => {
        if (!window.ytPlayerInstance || !isReady) return;
        if (window.ytPlayerInstance.isMuted()) {
          window.ytPlayerInstance.unMute();
          muteBtn.innerText = '🔊';
        } else {
          window.ytPlayerInstance.mute();
          muteBtn.innerText = '🔇';
        }
      });

      function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      }

      function updateProgress() {
        if (!window.ytPlayerInstance || !isReady || isDraggingSeek) return;
        const cur = window.ytPlayerInstance.getCurrentTime() || 0;
        const dur = window.ytPlayerInstance.getDuration() || 0;
        document.getElementById('timeDisplay').innerText = `${formatTime(cur)} / ${formatTime(dur)}`;
        if (dur > 0) {
          const pct = (cur / dur) * 100;
          document.getElementById('seekProgress').style.width = pct + '%';
          document.getElementById('seekThumb').style.left = pct + '%';
        }
      }

      const seekContainer = document.getElementById('seekContainer');
      function executeSeek(e) {
        if (!window.ytPlayerInstance || !isReady) return;
        const rect = seekContainer.getBoundingClientRect();
        const clickX = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
        const pct = clickX / rect.width;
        window.ytPlayerInstance.seekTo(window.ytPlayerInstance.getDuration() * pct, true);
      }
      seekContainer.addEventListener('mousedown', (e) => { isDraggingSeek = true; executeSeek(e); });
      window.addEventListener('mousemove', (e) => { if (isDraggingSeek) executeSeek(e); });
      window.addEventListener('mouseup', () => { isDraggingSeek = false; });

      document.getElementById('fsBtn').addEventListener('click', () => {
        if (!document.fullscreenElement) ytEngine.requestFullscreen().catch(err => alert(err.message));
        else document.exitFullscreen();
      });
    }

    // Anti-Inspection and Hotkey Shields
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "U")) {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
