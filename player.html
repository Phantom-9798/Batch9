<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM | Tactical Video Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Military Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #04070b;
      -webkit-user-select: none;
      user-select: none;
    }
    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-body { font-family: 'Inter', sans-serif; }

    .tactical-bg {
      background: 
        radial-gradient(circle at 50% 10%, rgba(239, 68, 68, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.14) 0%, transparent 50%),
        radial-gradient(circle at 85% 60%, rgba(234, 179, 8, 0.14) 0%, transparent 50%),
        linear-gradient(180deg, rgba(4, 7, 13, 0.95) 0%, rgba(2, 4, 7, 0.99) 100%);
    }

    .hud-grid {
      background-image: 
        linear-gradient(rgba(245, 158, 11, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 158, 11, 0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .armor-panel {
      background: rgba(10, 15, 22, 0.95);
      border: 1px solid rgba(245, 158, 11, 0.3);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>

<body class="tactical-bg hud-grid text-neutral-100 min-h-screen flex flex-col justify-between" oncontextmenu="return false;">

  <!-- TOP CONSOLE HEADER -->
  <header class="w-full pt-6 pb-4 px-4 border-b border-neutral-800/80 bg-black/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <div>
          <h1 class="font-orbitron font-bold text-xs sm:text-sm tracking-wider text-amber-400 uppercase" id="playerTitle">
            TACTICAL STREAMING CONSOLE
          </h1>
          <p class="text-[10px] text-neutral-400 font-mono">ENCRYPTED FEED &bull; AIRSPACE AUTHORIZED</p>
        </div>
      </div>
      <button onclick="window.history.back()" class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-neutral-300 text-xs font-orbitron font-bold px-3.5 py-2 rounded-lg uppercase tracking-wider transition cursor-pointer">
        &larr; BACK TO LECTURES
      </button>
    </div>
  </header>

  <!-- MAIN VIDEO VIEWPORT -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full flex flex-col items-center justify-center">
    <div class="w-full armor-panel rounded-2xl p-2 sm:p-3 overflow-hidden shadow-2xl">
      <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-black shadow-inner flex items-center justify-center">
        
        <iframe 
          id="tacticalPlayer" 
          src="" 
          class="w-full h-full border-0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" 
          allowfullscreen="true"
          webkitallowfullscreen="true"
          mozallowfullscreen="true"
          referrerpolicy="no-referrer">
        </iframe>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full bg-black/95 border-t border-neutral-900 py-3 px-4 text-center">
    <p class="text-[11px] font-mono text-neutral-500 tracking-wider">
      &copy; 2026 TEAM PHANTOM &bull; ANTI-LEAK STREAM TERMINAL
    </p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Session Storage से डेटा निकालें (URL से टूटने का खतरा खत्म)
      const storedVideo = sessionStorage.getItem("phantom_current_video");
      const storedTitle = sessionStorage.getItem("phantom_current_title");

      // 2. URL Parameters (Fallback)
      const urlParams = new URLSearchParams(window.location.search);
      const urlVideo = urlParams.get("v") || urlParams.get("stream");
      const urlTitle = urlParams.get("title");

      const finalVideo = storedVideo || urlVideo;
      const finalTitle = storedTitle || urlTitle || "TACTICAL SESSION";

      const titleElem = document.getElementById("playerTitle");
      const playerFrame = document.getElementById("tacticalPlayer");

      if (titleElem && finalTitle) {
        titleElem.innerText = decodeURIComponent(finalTitle);
      }

      if (!finalVideo) {
        alert("Session error: Video stream not found.");
        return;
      }

      // 3. चेक करें कि लिंक Nexield / Web URL है या YouTube ID
      if (finalVideo.startsWith("http://") || finalVideo.startsWith("https://")) {
        // Direct Nexield Player Stream
        playerFrame.src = finalVideo;
      } else {
        // YouTube Player
        playerFrame.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(finalVideo)}?autoplay=1&rel=0&modestbranding=1`;
      }
    });

    // Disable Inspect & Developer Tools shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "U")) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
