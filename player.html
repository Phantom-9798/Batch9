<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM | Tactical Video Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #04070b;
      -webkit-user-select: none;
      user-select: none;
    }
    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }

    .tactical-bg {
      background: 
        radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
        linear-gradient(180deg, rgba(4, 7, 13, 0.96) 0%, rgba(2, 4, 7, 0.99) 100%);
    }

    .hud-grid {
      background-image: 
        linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .armor-panel {
      background: rgba(10, 15, 22, 0.95);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
    }

    #tacticalViewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      overflow: hidden;
      border-radius: 0.75rem;
    }

    #tacticalViewport:fullscreen,
    #tacticalViewport:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
    }

    /* YouTube: ऊपर से 10% बाहर धकेला गया (चैनल नेम और शेयर बटन स्क्रीन से बाहर) */
    #tacticalViewport.mode-youtube iframe {
      position: absolute;
      width: 100% !important;
      height: 114% !important;
      top: -10% !important;
      left: 0;
      border: none;
    }

    /* Nexield: ऊपर से 4% बाहर */
    #tacticalViewport.mode-nexield iframe {
      position: absolute;
      width: 100% !important;
      height: 106% !important;
      top: -3.8% !important;
      left: 0;
      border: none;
    }

    /* ऊपर का शेयर ब्लॉक स्ट्रिप */
    .top-anti-share {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 48px;
      z-index: 30;
      background: linear-gradient(180deg, #000000 40%, rgba(0,0,0,0) 100%);
      pointer-events: auto;
    }

    /* एक्टिव स्पीड बटन का कलर */
    .speed-btn.active {
      background-color: #10b981 !important;
      color: #000000 !important;
      font-weight: 800;
    }
  </style>
</head>

<body class="tactical-bg hud-grid text-neutral-100 min-h-screen flex flex-col justify-between" oncontextmenu="return false;">

  <!-- HEADER -->
  <header class="w-full pt-6 pb-4 px-4 border-b border-emerald-950/60 bg-black/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <div>
          <h1 class="font-orbitron font-bold text-xs sm:text-sm tracking-wider text-emerald-400 uppercase" id="playerTitle">
            TACTICAL STREAMING CONSOLE
          </h1>
          <p class="text-[10px] text-neutral-400 font-mono">SECURE AIRSPACE TRANSMISSION</p>
        </div>
      </div>
      <button onclick="window.history.back()" class="bg-neutral-900 hover:bg-neutral-800 border border-emerald-600/40 text-emerald-400 text-xs font-orbitron font-bold px-3.5 py-2 rounded-lg transition cursor-pointer">
        &larr; BACK TO LECTURES
      </button>
    </div>
  </header>

  <!-- MAIN CONSOLE -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full flex flex-col items-center justify-center gap-4">
    
    <!-- VIDEO VIEWPORT -->
    <div class="w-full armor-panel rounded-2xl p-2 sm:p-3 overflow-hidden shadow-2xl relative">
      <div id="tacticalViewport">
        <!-- Top Shield to block Title/Share -->
        <div class="top-anti-share" id="topShield"></div>

        <iframe 
          id="tacticalPlayer" 
          src="" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen="true">
        </iframe>
      </div>
    </div>

    <!-- TACTICAL QUICK-CONTROLS HUD (SPEED & FULLSCREEN) -->
    <div class="w-full armor-panel rounded-xl px-4 py-3 flex flex-wrap items-center justify-between gap-3 bg-black/80">
      
      <!-- SPEED CONTROLLER -->
      <div class="flex items-center gap-2" id="speedControlGroup">
        <span class="text-xs font-orbitron text-neutral-400 tracking-wider">SPEED:</span>
        <div class="flex items-center gap-1.5 bg-neutral-900 border border-neutral-700/80 rounded-lg p-1">
          <button onclick="setPlaybackSpeed(1, this)" class="speed-btn active px-2.5 py-1 text-xs font-mono rounded bg-neutral-800 hover:text-emerald-400 transition">1.0x</button>
          <button onclick="setPlaybackSpeed(1.25, this)" class="speed-btn px-2.5 py-1 text-xs font-mono rounded bg-neutral-800 hover:text-emerald-400 transition">1.25x</button>
          <button onclick="setPlaybackSpeed(1.5, this)" class="speed-btn px-2.5 py-1 text-xs font-mono rounded bg-neutral-800 hover:text-emerald-400 transition">1.5x</button>
          <button onclick="setPlaybackSpeed(2, this)" class="speed-btn px-2.5 py-1 text-xs font-mono rounded bg-neutral-800 hover:text-emerald-400 transition">2.0x</button>
        </div>
      </div>

      <!-- STATUS & FULLSCREEN -->
      <div class="flex items-center gap-3">
        <span class="text-[11px] font-mono text-emerald-400/80 hidden sm:inline">&bull; 1080P HD SYNCED</span>
        <button onclick="toggleTacticalFullscreen()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-black text-xs font-orbitron font-extrabold rounded-lg tracking-wider transition shadow cursor-pointer">
          FULLSCREEN [⛶]
        </button>
      </div>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="w-full bg-black/95 border-t border-neutral-900 py-3 px-4 text-center">
    <p class="text-[11px] font-mono text-emerald-500/80 tracking-wider">
      &copy; 2026 TEAM PHANTOM &bull; LEAK-PROOF TACTICAL TERMINAL
    </p>
  </footer>

  <script>
    let playerIframe = null;

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlVideo = urlParams.get("v") || urlParams.get("stream");
      const urlTitle = urlParams.get("title");

      const storedVideo = sessionStorage.getItem("phantom_current_video");
      const storedTitle = sessionStorage.getItem("phantom_current_title");

      const finalVideo = urlVideo || storedVideo;
      const finalTitle = urlTitle || storedTitle || "TACTICAL SQUADRON CLASS";

      if (finalTitle) {
        document.getElementById("playerTitle").innerText = decodeURIComponent(finalTitle);
      }

      if (!finalVideo) {
        alert("Session error: Video target not found.");
        return;
      }

      const viewport = document.getElementById("tacticalViewport");
      playerIframe = document.getElementById("tacticalPlayer");
      const topShield = document.getElementById("topShield");

      // CASE 1: Nexield / Vimeo Stream
      if (finalVideo.startsWith("http://") || finalVideo.startsWith("https://")) {
        viewport.classList.add("mode-nexield");
        viewport.classList.remove("mode-youtube");
        topShield.style.display = "none"; // Nexield me khud ke controls aate hain
        playerIframe.src = finalVideo;
      } 
      // CASE 2: YouTube Video ID (CDS OTA)
      else {
        viewport.classList.add("mode-youtube");
        viewport.classList.remove("mode-nexield");
        topShield.style.display = "block"; // Top Share & Channel Block

        // enablejsapi=1 lagaya hai taaki humare custom speed buttons kaam karein
        playerIframe.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(finalVideo)}?autoplay=1&enablejsapi=1&rel=0&modestbranding=1&fs=0&iv_load_policy=3`;
      }
    });

    // YouTube Playback Speed Controller via postMessage (100% Reliable)
    function setPlaybackSpeed(speed, btnElement) {
      // Button styling active
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      // YouTube API ko direct command bhejna
      if (playerIframe && playerIframe.contentWindow) {
        playerIframe.contentWindow.postMessage(JSON.stringify({
          event: 'command',
          func: 'setPlaybackRate',
          args: [speed]
        }), '*');
      }
    }

    // Fullscreen Handler
    function toggleTacticalFullscreen() {
      const target = document.getElementById("tacticalViewport");
      if (!document.fullscreenElement) {
        if (target.requestFullscreen) target.requestFullscreen();
        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Disable Inspect Shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "U")) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
