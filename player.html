<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM | Tactical Video Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #04070b;
      -webkit-user-select: none;
      user-select: none;
    }
    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }

    .tactical-bg {
      background: 
        radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.12) 0%, transparent 50%),
        linear-gradient(180deg, rgba(4, 7, 13, 0.96) 0%, rgba(2, 4, 7, 0.99) 100%);
    }

    .hud-grid {
      background-image: 
        linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .armor-panel {
      background: rgba(10, 15, 22, 0.95);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
    }

    /* मुख्य प्रोटेक्टेड व्यूकंटेनर */
    #phantomConsoleScreen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      overflow: hidden;
      border-radius: 0.75rem;
    }

    /* जब छात्र फुलस्क्रीन करे तो कंटेनर खुद बड़ा होगा (ताकि Nexield का पॉपअप न आए) */
    #phantomConsoleScreen:fullscreen,
    #phantomConsoleScreen:-webkit-full-screen,
    #phantomConsoleScreen:-moz-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
    }

    /* YOUTUBE: ऊपर से 11% बाहर (चैनल नाम व शेयर बटन गायब), नीचे से लोगो गायब */
    #phantomConsoleScreen.is-youtube iframe {
      position: absolute;
      width: 100% !important;
      height: 114% !important;
      top: -11% !important;
      left: 0;
      border: none;
    }

    /* NEXIELD: ऊपर से 4.2% बाहर ('AFCAT CLASS' और वॉटरमार्क कटकर गायब) */
    #phantomConsoleScreen.is-nexield iframe {
      position: absolute;
      width: 100% !important;
      height: 106% !important;
      top: -4.2% !important;
      left: 0;
      border: none;
    }

    /* 1. TOP SHIELD: चैनल नाम व शेयर बटन पर क्लिक 100% ब्लॉक */
    .shield-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 52px;
      z-index: 35;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.98) 40%, rgba(0, 0, 0, 0) 100%);
      pointer-events: auto;
    }

    /* 2. BOTTOM YOUTUBE LOGO SHIELD: यूट्यूब लोगो पर क्लिक ब्लॉक (ताकि कोई रीडायरेक्ट न हो) */
    .shield-bottom-logo {
      position: absolute;
      bottom: 0;
      right: 52px; /* Settings और Fullscreen खुला रहेगा */
      width: 85px;  /* सिर्फ YouTube लिखे लोगो को कवर करेगा */
      height: 44px;
      z-index: 35;
      background: transparent;
      pointer-events: auto;
      display: none;
    }

    #phantomConsoleScreen.is-youtube .shield-bottom-logo {
      display: block;
    }

    /* 3. TACTICAL OVERLAY FULLSCREEN TOGGLE (Nexield नोटिफिकेशन ब्लॉक करने के लिए) */
    .tactical-fs-trigger {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 40;
      background: rgba(16, 185, 129, 0.9);
      color: #000;
      padding: 5px 11px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
      transition: all 0.2s ease;
    }
    .tactical-fs-trigger:hover {
      background: #10b981;
      transform: scale(1.04);
    }
  </style>
</head>

<body class="tactical-bg hud-grid text-neutral-100 min-h-screen flex flex-col justify-between" oncontextmenu="return false;">

  <!-- TOP HEADER -->
  <header class="w-full pt-6 pb-4 px-4 border-b border-emerald-950/60 bg-black/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <div>
          <h1 class="font-orbitron font-bold text-xs sm:text-sm tracking-wider text-emerald-400 uppercase" id="playerTitle">
            TACTICAL STREAMING CONSOLE
          </h1>
          <p class="text-[10px] text-neutral-400 font-mono">SECURE PROTECTED AIRSPACE</p>
        </div>
      </div>
      <button onclick="window.history.back()" class="bg-neutral-900 hover:bg-neutral-800 border border-emerald-600/40 text-emerald-400 text-xs font-orbitron font-bold px-3.5 py-2 rounded-lg uppercase tracking-wider transition cursor-pointer">
        &larr; BACK TO LECTURES
      </button>
    </div>
  </header>

  <!-- MAIN VIDEO VIEWPORT -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full flex flex-col items-center justify-center">
    <div class="w-full armor-panel rounded-2xl p-2 sm:p-3 overflow-hidden shadow-2xl relative">
      
      <div id="phantomConsoleScreen">
        <!-- Top Shield (चैनल नाम व शेयर बटन ब्लॉक) -->
        <div class="shield-top"></div>

        <!-- YouTube Logo Block (रीडायरेक्ट ब्लॉक) -->
        <div class="shield-bottom-logo"></div>

        <!-- Custom Team Phantom Fullscreen Button -->
        <button id="customFsBtn" class="tactical-fs-trigger font-orbitron" onclick="toggleTacticalFullscreen()">
          [⛶ FULLSCREEN]
        </button>

        <iframe 
          id="tacticalPlayer" 
          src="" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen="false">
        </iframe>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full bg-black/95 border-t border-neutral-900 py-3 px-4 text-center">
    <p class="text-[11px] font-mono text-emerald-500/80 tracking-wider">
      &copy; 2026 TEAM PHANTOM &bull; ANTI-LEAK STREAM TERMINAL
    </p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlVideo = urlParams.get("v") || urlParams.get("stream");
      const urlTitle = urlParams.get("title");

      const storedVideo = sessionStorage.getItem("phantom_current_video");
      const storedTitle = sessionStorage.getItem("phantom_current_title");

      const finalVideo = urlVideo || storedVideo;
      const finalTitle = urlTitle || storedTitle || "TACTICAL SQUADRON CLASS";

      if (finalTitle) {
        document.getElementById("playerTitle").innerText = decodeURIComponent(finalTitle);
      }

      if (!finalVideo) {
        alert("Session error: Video target not found.");
        return;
      }

      const playerFrame = document.getElementById("tacticalPlayer");
      const screen = document.getElementById("phantomConsoleScreen");

      // CASE 1: Nexield (Vimeo Stream)
      if (finalVideo.startsWith("http://") || finalVideo.startsWith("https://")) {
        screen.classList.remove("is-youtube");
        screen.classList.add("is-nexield");
        playerFrame.src = finalVideo;
      } 
      // CASE 2: YouTube Video (CDS OTA)
      else {
        screen.classList.remove("is-nexield");
        screen.classList.add("is-youtube");
        // controls=1 (स्पीड और क्वालिटी सेटिंग्स चालू), modestbranding=1, rel=0, fs=0 (नेटिव फुलस्क्रीन बंद ताकि कस्टम फुलस्क्रीन चले)
        playerFrame.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(finalVideo)}?autoplay=1&controls=1&rel=0&modestbranding=1&fs=0&iv_load_policy=3&disablekb=0`;
      }
    });

    // Custom Tactical Fullscreen (Nexield के 'Nexield vimpd' पॉपअप को रोकने का समाधान)
    function toggleTacticalFullscreen() {
      const target = document.getElementById("phantomConsoleScreen");
      const fsBtn = document.getElementById("customFsBtn");

      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (target.requestFullscreen) {
          target.requestFullscreen();
        } else if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();
        }
        fsBtn.innerText = "[✕ EXIT]";
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        fsBtn.innerText = "[⛶ FULLSCREEN]";
      }
    }

    document.addEventListener("fullscreenchange", () => {
      const fsBtn = document.getElementById("customFsBtn");
      if (!document.fullscreenElement) {
        fsBtn.innerText = "[⛶ FULLSCREEN]";
      }
    });

    // Disable Inspect & Shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "U")) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
