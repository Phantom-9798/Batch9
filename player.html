<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM | Tactical Video Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- Military Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #04070b;
      -webkit-user-select: none;
      user-select: none;
    }
    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }

    .tactical-bg {
      background: 
        radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.12) 0%, transparent 50%),
        linear-gradient(180deg, rgba(4, 7, 13, 0.96) 0%, rgba(2, 4, 7, 0.99) 100%);
    }

    .hud-grid {
      background-image: 
        linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .armor-panel {
      background: rgba(10, 15, 22, 0.95);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
    }

    #phantomConsoleScreen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      overflow: hidden;
      border-radius: 0.75rem;
    }

    #phantomConsoleScreen:fullscreen,
    #phantomConsoleScreen:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
    }

    #phantomConsoleScreen.controls-hidden {
      cursor: none;
    }

    /* NEXIELD (VIMEO) - NO BLACK MASK, PURE CROP */
    .nexield-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .nexield-frame {
      position: absolute;
      width: 100% !important;
      height: 105% !important;
      top: -3.5% !important;
      left: 0;
      border: none;
    }

    .nexield-fs-interceptor {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 52px;
      height: 48px;
      z-index: 30;
      background: transparent;
      cursor: pointer;
    }

    /* YOUTUBE ENGINE */
    .yt-custom-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #ytPlayerFrame {
      position: absolute;
      width: 100% !important;
      height: 136% !important;
      top: -18% !important;
      left: 0;
      pointer-events: none;
    }

    /* SCREEN TAP ZONES FOR 10s SKIP */
    .tap-zone {
      position: absolute;
      top: 0;
      bottom: 55px;
      width: 48%;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .tap-zone-left { left: 0; }
    .tap-zone-right { right: 0; }

    .skip-alert-badge {
      background: rgba(16, 185, 129, 0.9);
      color: #000000;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 900;
      padding: 10px 18px;
      border-radius: 9999px;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.6);
      transition: all 0.2s ease;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.8);
    }
    .skip-alert-badge.show {
      opacity: 1;
      transform: scale(1.1);
    }

    /* CENTER FULLSCREEN & EXIT BUTTON */
    .center-fs-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 35;
      background: rgba(16, 185, 129, 0.95);
      color: #000;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.6);
      opacity: 1;
      transition: opacity 0.3s ease, transform 0.2s ease;
    }

    #phantomConsoleScreen.controls-hidden .center-fs-btn {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .center-fs-btn:hover {
      background: #10b981;
      transform: translate(-50%, -50%) scale(1.06);
    }

    /* TACTICAL CONTROL BAR */
    .tactical-custom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(180deg, transparent 0%, rgba(4, 7, 11, 0.97) 70%);
      padding: 10px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 40;
      opacity: 1;
      transition: opacity 0.35s ease;
    }

    #phantomConsoleScreen.controls-hidden .tactical-custom-bar {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .tactical-progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }

    .tactical-progress-fill {
      height: 100%;
      background: #10b981;
      width: 0%;
      border-radius: 3px;
      transition: width 0.15s linear;
    }
  </style>
</head>

<body class="tactical-bg hud-grid text-neutral-100 min-h-screen flex flex-col justify-between" oncontextmenu="return false;">

  <!-- TOP HEADER -->
  <header class="w-full pt-6 pb-4 px-4 border-b border-emerald-950/60 bg-black/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <div>
          <h1 class="font-orbitron font-bold text-xs sm:text-sm tracking-wider text-emerald-400 uppercase" id="playerTitle">
            TACTICAL STREAMING CONSOLE
          </h1>
          <p class="text-[10px] text-neutral-400 font-mono">SECURE AIRSPACE TRANSMISSION</p>
        </div>
      </div>
      <button onclick="window.history.back()" class="bg-neutral-900 hover:bg-neutral-800 border border-emerald-600/40 text-emerald-400 text-xs font-orbitron font-bold px-3.5 py-2 rounded-lg uppercase tracking-wider transition cursor-pointer">
        &larr; BACK TO LECTURES
      </button>
    </div>
  </header>

  <!-- MAIN VIDEO VIEWPORT -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full flex flex-col items-center justify-center">
    <div class="w-full armor-panel rounded-2xl p-2 sm:p-3 overflow-hidden shadow-2xl relative">
      <div id="phantomConsoleScreen">
        
        <!-- सेंटर फुलस्क्रीन / एग्ज़िट बटन -->
        <button id="centerFsBtn" class="center-fs-btn font-orbitron" onclick="toggleTacticalFullscreen()">
          [⛶ FULLSCREEN]
        </button>

        <!-- डायनामिक वीडियो एरिया -->
        <div id="playerRoot" class="w-full h-full relative"></div>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full bg-black/95 border-t border-neutral-900 py-3 px-4 text-center">
    <p class="text-[11px] font-mono text-emerald-500/80 tracking-wider">
      &copy; 2026 TEAM PHANTOM &bull; ANTI-LEAK STREAM TERMINAL
    </p>
  </footer>

  <script>
    let ytInstance = null;
    let isPlaying = false;
    let timerSync = null;
    let hideControlsTimeout = null;

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlVideo = urlParams.get("v") || urlParams.get("stream");
      const urlTitle = urlParams.get("title");

      const storedVideo = sessionStorage.getItem("phantom_current_video");
      const storedTitle = sessionStorage.getItem("phantom_current_title");

      const finalVideo = urlVideo || storedVideo;
      const finalTitle = urlTitle || storedTitle || "TACTICAL SQUADRON CLASS";

      if (finalTitle) {
        document.getElementById("playerTitle").innerText = decodeURIComponent(finalTitle);
      }

      if (!finalVideo) {
        alert("Session error: Video target not found.");
        return;
      }

      const playerRoot = document.getElementById("playerRoot");

      // CASE 1: NEXIELD (Clean Crop, No Black Mask)
      if (finalVideo.startsWith("http://") || finalVideo.startsWith("https://")) {
        playerRoot.innerHTML = `
          <div class="nexield-wrapper">
            <div class="nexield-fs-interceptor" onclick="toggleTacticalFullscreen()" title="Fullscreen"></div>
            <iframe 
              src="${finalVideo}" 
              class="nexield-frame" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
            </iframe>
          </div>
        `;
      } 
      // CASE 2: YOUTUBE (CUSTOM HUD WITH REAL CONTROLS)
      else {
        playerRoot.innerHTML = `
          <div class="yt-custom-container">
            <div id="ytPlayerFrame"></div>

            <div class="tap-zone tap-zone-left" onclick="handleTapZone('left')">
              <div class="skip-alert-badge" id="skipLeftBadge">&#171; 10s</div>
            </div>

            <div class="tap-zone tap-zone-right" onclick="handleTapZone('right')">
              <div class="skip-alert-badge" id="skipRightBadge">10s &#187;</div>
            </div>

            <div class="tactical-custom-bar" onclick="event.stopPropagation()">
              <div class="tactical-progress-track" onclick="seekVideoTrack(event)">
                <div class="tactical-progress-fill" id="trackFill"></div>
              </div>

              <div class="flex items-center justify-between text-xs font-mono pt-1">
                <div class="flex items-center gap-2">
                  <button onclick="toggleVideoPlay()" id="playTrigger" class="text-emerald-400 font-bold text-xs uppercase px-2.5 py-1 bg-black/70 rounded border border-emerald-600/40 hover:bg-emerald-950 transition cursor-pointer">
                    ▶ PLAY
                  </button>

                  <button onclick="skipSeconds(-10); triggerBadge('skipLeftBadge')" title="Rewind 10s" class="text-neutral-300 hover:text-emerald-400 font-orbitron font-bold text-[11px] px-2 py-1 bg-black/70 rounded border border-neutral-700/80 hover:border-emerald-500/50 transition cursor-pointer">
                    « 10s
                  </button>

                  <span id="timeCounter" class="text-neutral-300 font-mono text-[11px] px-1">00:00 / 00:00</span>

                  <button onclick="skipSeconds(10); triggerBadge('skipRightBadge')" title="Forward 10s" class="text-neutral-300 hover:text-emerald-400 font-orbitron font-bold text-[11px] px-2 py-1 bg-black/70 rounded border border-neutral-700/80 hover:border-emerald-500/50 transition cursor-pointer">
                    10s »
                  </button>
                </div>

                <div class="flex items-center gap-2">
                  <div class="flex items-center gap-1 bg-black/80 border border-neutral-700/80 rounded px-1.5 py-0.5">
                    <span class="text-neutral-400 text-[10px] font-orbitron">SPD:</span>
                    <select onchange="updateVideoSpeed(this.value)" class="bg-transparent text-emerald-400 font-bold text-xs outline-none cursor-pointer">
                      <option value="1" class="bg-black">1.0x</option>
                      <option value="1.25" class="bg-black">1.25x</option>
                      <option value="1.5" class="bg-black">1.5x</option>
                      <option value="1.75" class="bg-black">1.75x</option>
                      <option value="2" class="bg-black">2.0x</option>
                    </select>
                  </div>

                  <div class="flex items-center gap-1 bg-black/80 border border-neutral-700/80 rounded px-1.5 py-0.5">
                    <span class="text-neutral-400 text-[10px] font-orbitron">QUAL:</span>
                    <select onchange="updateVideoQuality(this.value)" class="bg-transparent text-emerald-400 font-bold text-xs outline-none cursor-pointer">
                      <option value="auto" class="bg-black">Auto</option>
                      <option value="hd1080" class="bg-black">1080p HD</option>
                      <option value="hd720" class="bg-black">720p HD</option>
                      <option value="large" class="bg-black">480p</option>
                      <option value="medium" class="bg-black">360p</option>
                    </select>
                  </div>

                  <button id="miniFsBtn" onclick="toggleTacticalFullscreen()" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-black text-[11px] font-orbitron font-extrabold rounded tracking-wider transition cursor-pointer">
                    [⛶]
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;

        window.onYouTubeIframeAPIReady = () => {
          ytInstance = new YT.Player('ytPlayerFrame', {
            videoId: finalVideo,
            playerVars: {
              autoplay: 1,
              controls: 0,
              disablekb: 0,
              fs: 0,
              modestbranding: 1,
              rel: 0,
              showinfo: 0,
              iv_load_policy: 3
            },
            events: {
              onReady: (e) => {
                e.target.playVideo();
                startTimerSync();
                resetAutoHideTimer();
              },
              onStateChange: (e) => {
                const btn = document.getElementById("playTrigger");
                if (e.data === YT.PlayerState.PLAYING) {
                  isPlaying = true;
                  if (btn) btn.innerText = "⏸ PAUSE";
                  resetAutoHideTimer();
                } else {
                  isPlaying = false;
                  if (btn) btn.innerText = "▶ PLAY";
                  showControls();
                }
              }
            }
          });
        };

        if (window.YT && window.YT.Player) {
          window.onYouTubeIframeAPIReady();
        }
      }

      // माउस मूव पर कंट्रोल्स दिखाना और टाइमर रीसेट करना
      const screenEl = document.getElementById("phantomConsoleScreen");
      screenEl.addEventListener("mousemove", () => {
        showControls();
        resetAutoHideTimer();
      });
    });

    function showControls() {
      document.getElementById("phantomConsoleScreen").classList.remove("controls-hidden");
    }

    function hideControls() {
      document.getElementById("phantomConsoleScreen").classList.add("controls-hidden");
    }

    function resetAutoHideTimer() {
      clearTimeout(hideControlsTimeout);
      hideControlsTimeout = setTimeout(() => {
        hideControls();
      }, 2500);
    }

    // Skip & Tap Logic
    let leftTimer = null, rightTimer = null;
    let leftClicks = 0, rightClicks = 0;

    function handleTapZone(side) {
      showControls();
      resetAutoHideTimer();

      if (side === 'left') {
        leftClicks++;
        if (leftClicks === 1) {
          leftTimer = setTimeout(() => {
            toggleVideoPlay();
            leftClicks = 0;
          }, 270);
        } else if (leftClicks === 2) {
          clearTimeout(leftTimer);
          skipSeconds(-10);
          triggerBadge('skipLeftBadge');
          leftClicks = 0;
        }
      } else {
        rightClicks++;
        if (rightClicks === 1) {
          rightTimer = setTimeout(() => {
            toggleVideoPlay();
            rightClicks = 0;
          }, 270);
        } else if (rightClicks === 2) {
          clearTimeout(rightTimer);
          skipSeconds(10);
          triggerBadge('skipRightBadge');
          rightClicks = 0;
        }
      }
    }

    function skipSeconds(s) {
      if (!ytInstance || !ytInstance.getCurrentTime) return;
      const target = Math.max(0, ytInstance.getCurrentTime() + s);
      ytInstance.seekTo(target, true);
    }

    function triggerBadge(id) {
      const b = document.getElementById(id);
      if (!b) return;
      b.classList.add('show');
      setTimeout(() => b.classList.remove('show'), 550);
    }

    function toggleVideoPlay() {
      if (!ytInstance) return;
      if (isPlaying) ytInstance.pauseVideo();
      else ytInstance.playVideo();
    }

    function updateVideoSpeed(rate) {
      if (!ytInstance) return;
      ytInstance.setPlaybackRate(parseFloat(rate));
      resetAutoHideTimer();
    }

    function updateVideoQuality(quality) {
      if (!ytInstance) return;
      const target = quality === 'auto' ? 'default' : quality;
      ytInstance.setPlaybackQuality(target);
      if (ytInstance.getCurrentTime) {
        ytInstance.seekTo(ytInstance.getCurrentTime(), true);
      }
      resetAutoHideTimer();
    }

    function seekVideoTrack(e) {
      if (!ytInstance) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      ytInstance.seekTo(pos * ytInstance.getDuration(), true);
      resetAutoHideTimer();
    }

    function startTimerSync() {
      if (timerSync) clearInterval(timerSync);
      timerSync = setInterval(() => {
        if (ytInstance && ytInstance.getCurrentTime) {
          const c = ytInstance.getCurrentTime();
          const d = ytInstance.getDuration();
          if (d > 0) {
            const fill = document.getElementById("trackFill");
            if (fill) fill.style.width = ((c / d) * 100) + "%";
            const counter = document.getElementById("timeCounter");
            if (counter) counter.innerText = `${formatSeconds(c)} / ${formatSeconds(d)}`;
          }
        }
      }, 500);
    }

    function formatSeconds(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${sec}`;
    }

    // Fullscreen / Exit Handler
    function toggleTacticalFullscreen() {
      const target = document.getElementById("phantomConsoleScreen");
      const centerBtn = document.getElementById("centerFsBtn");
      const miniFsBtn = document.getElementById("miniFsBtn");

      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (target.requestFullscreen) target.requestFullscreen();
        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
        if (centerBtn) centerBtn.innerText = "[✕ EXIT]";
        if (miniFsBtn) miniFsBtn.innerText = "[✕]";
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        if (centerBtn) centerBtn.innerText = "[⛶ FULLSCREEN]";
        if (miniFsBtn) miniFsBtn.innerText = "[⛶]";
      }
      showControls();
      resetAutoHideTimer();
    }

    document.addEventListener("fullscreenchange", () => {
      const centerBtn = document.getElementById("centerFsBtn");
      const miniFsBtn = document.getElementById("miniFsBtn");
      if (!document.fullscreenElement) {
        if (centerBtn) centerBtn.innerText = "[⛶ FULLSCREEN]";
        if (miniFsBtn) miniFsBtn.innerText = "[⛶]";
      } else {
        if (centerBtn) centerBtn.innerText = "[✕ EXIT]";
        if (miniFsBtn) miniFsBtn.innerText = "[✕]";
      }
    });

    // Disable Inspect Shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "U")) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
