<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM | Tactical Video Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Plyr Engine (Hides YouTube Branding & Adds Native Speed/Quality) -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.min.js"></script>

  <!-- Military Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #04070b;
      -webkit-user-select: none;
      user-select: none;
    }
    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }

    .tactical-bg {
      background: 
        radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.12) 0%, transparent 50%),
        linear-gradient(180deg, rgba(4, 7, 13, 0.96) 0%, rgba(2, 4, 7, 0.99) 100%);
    }

    .hud-grid {
      background-image: 
        linear-gradient(rgba(16, 185, 129, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .armor-panel {
      background: rgba(10, 15, 22, 0.95);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
    }

    .player-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 0.75rem;
      overflow: hidden;
    }

    /* Nexield Crop: सिर्फ ऊपर का AFCAT टेक्स्ट छुपाने के लिए */
    .nexield-frame {
      width: 100%;
      height: 106%;
      position: absolute;
      top: -3.8%;
      left: 0;
      border: none;
    }

    /* Plyr Clean Tactical Styling (No YouTube colors, pure Emerald) */
    :root {
      --plyr-color-main: #10b981;
      --plyr-video-background: #000000;
      --plyr-control-icon-size: 17px;
      --plyr-font-family: 'Rajdhani', sans-serif;
    }

    .plyr--video {
      height: 100% !important;
      width: 100% !important;
      border-radius: 0.75rem;
    }

    /* Hide YouTube Endscreen & Related Videos completely */
    .ytp-endscreen-paginate, .ytp-chrome-top, .ytp-watermark {
      display: none !important;
    }
  </style>
</head>

<body class="tactical-bg hud-grid text-neutral-100 min-h-screen flex flex-col justify-between" oncontextmenu="return false;">

  <!-- TOP HEADER -->
  <header class="w-full pt-6 pb-4 px-4 border-b border-emerald-950/60 bg-black/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <div>
          <h1 class="font-orbitron font-bold text-xs sm:text-sm tracking-wider text-emerald-400 uppercase" id="playerTitle">
            TACTICAL STREAMING CONSOLE
          </h1>
          <p class="text-[10px] text-neutral-400 font-mono">SECURE PROTECTED STREAM</p>
        </div>
      </div>
      <button onclick="window.history.back()" class="bg-neutral-900 hover:bg-neutral-800 border border-emerald-600/40 text-emerald-400 text-xs font-orbitron font-bold px-3.5 py-2 rounded-lg uppercase tracking-wider transition cursor-pointer">
        &larr; BACK TO LECTURES
      </button>
    </div>
  </header>

  <!-- MAIN VIDEO VIEWPORT -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full flex flex-col items-center justify-center">
    <div class="w-full armor-panel rounded-2xl p-2 sm:p-3 overflow-hidden shadow-2xl">
      <div class="player-container" id="videoWrapper">
        <!-- JS से डायनामिक प्लेयर लोड होगा -->
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="w-full bg-black/95 border-t border-neutral-900 py-3 px-4 text-center">
    <p class="text-[11px] font-mono text-emerald-500/80 tracking-wider">
      &copy; 2026 TEAM PHANTOM &bull; ANTI-LEAK STREAM TERMINAL
    </p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const urlVideo = urlParams.get("v") || urlParams.get("stream");
      const urlTitle = urlParams.get("title");

      const storedVideo = sessionStorage.getItem("phantom_current_video");
      const storedTitle = sessionStorage.getItem("phantom_current_title");

      const finalVideo = urlVideo || storedVideo;
      const finalTitle = urlTitle || storedTitle || "TACTICAL SQUADRON CLASS";

      if (finalTitle) {
        document.getElementById("playerTitle").innerText = decodeURIComponent(finalTitle);
      }

      if (!finalVideo) {
        alert("Session error: Video target not found.");
        return;
      }

      const wrapper = document.getElementById("videoWrapper");

      // CASE 1: Nexield / Vimeo Stream (AFCAT Chapters)
      if (finalVideo.startsWith("http://") || finalVideo.startsWith("https://")) {
        wrapper.innerHTML = `
          <iframe 
            src="${finalVideo}" 
            class="nexield-frame" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" 
            allowfullscreen>
          </iframe>
        `;
      } 
      // CASE 2: YouTube Video (CDS OTA Chapters) -> Plyr Custom Engine
      else {
        wrapper.innerHTML = `
          <div class="plyr__video-embed w-full h-full" id="tacticalPlyrContainer">
            <iframe
              src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(finalVideo)}?origin=${window.location.origin}&iv_load_policy=3&modestbranding=1&playsinline=1&showinfo=0&rel=0&enablejsapi=1"
              allowfullscreen
              allow="autoplay">
            </iframe>
          </div>
        `;

        // Plyr Controls: Speed और Quality को इनेबल किया गया है, शेयर और यूट्यूब लोगो को ब्लॉक किया गया है
        new Plyr('#tacticalPlyrContainer', {
          controls: [
            'play-large',
            'play',
            'progress',
            'current-time',
            'duration',
            'mute',
            'volume',
            'settings',
            'fullscreen'
          ],
          settings: ['speed', 'quality'],
          speed: { selected: 1, options: [0.75, 1, 1.25, 1.5, 1.75, 2] },
          youtube: { 
            noCookie: true, 
            rel: 0, 
            showinfo: 0, 
            iv_load_policy: 3, 
            modestbranding: 1 
          }
        });
      }
    });

    // Disable Inspect Shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "U")) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
