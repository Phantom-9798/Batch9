    let unsubscribeSnapshot = null;
    let currentBatchParam = "cds-kilo";
    let currentModeParam = "live";

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        window.location.href = "index.html";
        return;
      }

      unsubscribeSnapshot = onSnapshot(doc(db, "cadets", user.uid), (docSnap) => {
        if (!docSnap.exists()) {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          signOut(auth).then(() => window.location.href = "index.html");
          return;
        }

        const data = docSnap.data();
        const localToken = localStorage.getItem("phantom_session_token");

        if (data.status !== "active") {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          alert("Notice: Cadet account is currently not active or pending verification.");
          signOut(auth).then(() => window.location.href = "index.html");
          return;
        }

        if (data.activeSession && localToken && data.activeSession !== localToken) {
          if (unsubscribeSnapshot) unsubscribeSnapshot();
          alert("SECURITY PROTOCOL: Active session detected on another terminal. Logging out.");
          signOut(auth).then(() => {
            localStorage.removeItem("phantom_session_token");
            localStorage.removeItem("phantom_uid");
            window.location.href = "index.html";
          });
          return;
        }

        renderBatchCurriculum(data.allowedBatches || []);
      });
    });

    function renderBatchCurriculum(allowedBatches) {
      const urlParams = new URLSearchParams(window.location.search);
      currentBatchParam = urlParams.get('batch') || 'cds-kilo';
      currentModeParam = (urlParams.get('mode') === 'recorded') ? 'recorded' : 'live';

      const isCombo = allowedBatches.includes('combo') || allowedBatches.includes('all');
      if (!isCombo && !allowedBatches.includes(currentBatchParam)) {
        alert("ACCESS DENIED: You are not authorized for this specific squadron.");
        window.location.href = "classroom.html";
        return;
      }

      const currentCurriculum = curriculumData[currentBatchParam] || curriculumData["cds-kilo"];
      const isRecorded = currentModeParam === 'recorded';
      const modeLabel = isRecorded ? 'RECORDED VAULT' : 'LIVE SQUADRON';

      document.getElementById('batchHeading').innerText = `${currentCurriculum.title} (${modeLabel})`;
      document.getElementById('batchBadge').innerText = `${currentBatchParam.toUpperCase()} • ${modeLabel}`;

      const backBtn = document.getElementById('backToModesBtn');
      if (backBtn) {
        backBtn.href = `batch-mode.html?batch=${encodeURIComponent(currentBatchParam)}`;
      }

      const container = document.getElementById('subjectsContainer');
      container.innerHTML = "";

      const activeSubjectsList = (currentBatchParam === "cds-kilo") ? cdsOtaFullSubjects : currentCurriculum.subjects;

      activeSubjectsList.forEach((subj, index) => {
        const card = document.createElement('div');
        card.className = "armor-panel rounded-xl overflow-hidden flex flex-col justify-between hover:border-amber-500/60 transition cursor-pointer group shadow-lg";
        card.onclick = () => openSubjectModule(currentBatchParam, subj.name, currentModeParam);

        card.innerHTML = `
          <!-- CARD TOP IMAGE -->
          <div class="relative w-full h-36 sm:h-40 overflow-hidden bg-black">
            <img 
              src="${subj.image}" 
              alt="${subj.name}" 
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-80" 
              loading="lazy"
            />
            <div class="absolute inset-0 bg-gradient-to-t from-[#0a0f16] via-transparent to-black/40"></div>
            
            <div class="absolute top-2.5 left-2.5">
              <span class="px-2 py-0.5 rounded bg-black/85 border border-neutral-700 text-[10px] font-orbitron tracking-wider text-amber-400 font-bold uppercase">
                MODULE #${(index + 1).toString().padStart(2, '0')}
              </span>
            </div>
            
            <div class="absolute top-2.5 right-2.5">
              <span class="w-2.5 h-2.5 rounded-full ${isRecorded ? 'bg-amber-400 shadow-[0_0_8px_rgba(245,158,11,0.6)]' : 'bg-emerald-400 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.8)]'} inline-block"></span>
            </div>
          </div>

          <!-- CARD BOTTOM DETAILS -->
          <div class="p-4 flex-grow flex flex-col justify-between bg-[#0a0f16]">
            <div>
              <h3 class="font-orbitron font-bold text-base text-white group-hover:text-amber-400 transition mb-1">
                ${subj.name}
              </h3>
              <p class="text-[11px] text-neutral-400 font-body leading-snug mb-3">
                ${subj.desc}
              </p>
            </div>
            <div class="pt-2.5 border-t border-neutral-800 flex items-center justify-between mt-auto">
              <span class="text-[10px] font-mono ${isRecorded ? 'text-amber-400' : 'text-emerald-400'}">
                ${isRecorded ? 'RECORDED VAULT' : '🔴 LIVE READY'}
              </span>
              <span class="text-xs font-bold text-neutral-300 group-hover:text-amber-400">&rarr;</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openSubjectModule(batch, subjectName, mode) {
      window.location.href = `chapters.html?batch=${encodeURIComponent(batch)}&subject=${encodeURIComponent(subjectName)}&mode=${encodeURIComponent(mode)}`;
    }

    window.terminateCadetSession = function() {
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      signOut(auth).then(() => {
        localStorage.removeItem("phantom_session_token");
        localStorage.removeItem("phantom_uid");
        window.location.href = "index.html";
