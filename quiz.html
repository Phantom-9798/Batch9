<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM | SECURE CBT MAKER</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script>
    // ================= TIGHT SECURITY GATE =================
    (() => {
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
          (e.ctrlKey && ['U', 'S', 'P'].includes(e.key.toUpperCase()))
        ) {
          e.preventDefault();
          return false;
        }
      });
    })();
  </script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Rajdhani', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    /* Top Navbar */
    .cbt-header { background: #1e293b; border-bottom: 2px solid #334155; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; height: 65px; }
    .brand-area { display: flex; align-items: center; gap: 12px; }
    .brand-area img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #facc15; object-fit: cover; }
    .brand-text h2 { margin: 0; font-size: 18px; font-family: 'Black Ops One', cursive; color: #facc15; letter-spacing: 1px; }
    .brand-text p { margin: 2px 0 0 0; font-size: 11px; font-family: 'Orbitron', sans-serif; color: #34d399; letter-spacing: 2px; font-weight: bold; }
    
    .timer-box { background: #0f172a; border: 1px solid #334155; padding: 6px 14px; border-radius: 6px; font-family: 'Orbitron', sans-serif; font-size: 14px; color: #facc15; }
    
    /* Main Layout */
    .cbt-body { display: flex; flex: 1; height: calc(100vh - 130px); overflow: hidden; }
    .question-panel { flex: 1; padding: 25px; overflow-y: auto; background: #090d16; display: flex; flex-direction: column; justify-content: space-between; }
    
    .sidebar-panel { width: 300px; background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; }
    .user-profile { padding: 15px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 10px; background: #0f172a; }
    
    .palette-grid { padding: 15px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; overflow-y: auto; flex: 1; align-content: start; }
    .palette-btn { width: 40px; height: 40px; background: #334155; border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .palette-btn.attempted { background: #10b981; color: #000; }
    .palette-btn.marked { background: #9333ea; color: #fff; }
    .palette-btn.current { border: 2px solid #facc15; }

    /* Question Area */
    .q-header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; margin-bottom: 15px; }
    .marks-tag { font-size: 13px; font-family: 'Orbitron', sans-serif; }
    .pos-badge { background: rgba(16,185,129,0.2); color: #10b981; padding: 3px 8px; border-radius: 4px; border: 1px solid #10b981; }
    .neg-badge { background: rgba(239,68,68,0.2); color: #ef4444; padding: 3px 8px; border-radius: 4px; border: 1px solid #ef4444; margin-left: 5px; }

    .option-btn { display: block; width: 100%; padding: 14px 16px; margin: 12px 0; background: #111827; border: 2px solid #334155; color: #e5e7eb; border-radius: 8px; text-align: left; cursor: pointer; font-size: 16px; transition: 0.2s; }
    .option-btn:hover { background: #1f2937; border-color: #06b6d4; }

    /* Footer Buttons */
    .cbt-footer { background: #1e293b; border-top: 2px solid #334155; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; height: 65px; }
    .footer-left-btns, .footer-right-btns { display: flex; gap: 10px; }
    .btn-action { padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; border: none; font-family: 'Orbitron', sans-serif; transition: 0.2s; }
    .btn-review { background: #d97706; color: #000; }
    .btn-clear { background: #475569; color: #fff; }
    .btn-next { background: #2563eb; color: #fff; }
    .btn-submit { background: #10b981; color: #000; }

    /* Solution Box */
    .solution-box { margin-top: 20px; padding: 20px; background: #111827; border: 1px solid #10b981; border-radius: 8px; display: none; }
    .solution-box h4 { color: #34d399; margin-top: 0; font-family: 'Orbitron', sans-serif; }
    .correct-ans-label { color: #facc15; font-weight: bold; margin-bottom: 8px; font-family: 'Orbitron', sans-serif; font-size: 14px; }

    /* Scorecard */
    .scorecard { padding: 40px; text-align: center; display: none; max-width: 650px; margin: 30px auto; background: #1e293b; border-radius: 12px; border: 1px solid #10b981; }
    .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
    .stat-card { background: #0f172a; border: 1px solid #334155; padding: 15px; border-radius: 8px; }

    /* Generator Console */
    #makerConsole { padding: 30px; max-width: 800px; margin: 40px auto; background: #1e293b; border-radius: 12px; border: 1px solid #10b981; }
    input, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; margin-top: 5px; margin-bottom: 15px; font-family: monospace; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ================= AUTH GATE ================= -->

    <p style="font-size: 12px; color: #94a3b8;">ENTER CLEARANCE KEY TO PROCEED</p>
    <input id="quizPass" type="password" placeholder="Enter Password" style="text-align: center; letter-spacing: 3px; font-size: 16px;">
    <button onclick="unlockQuizTerminal()" style="width: 100%; padding: 12px; background: #10b981; color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-family: 'Orbitron';">VERIFY IDENTITY</button>
  </div>

      <div>
        <h2 style="font-family: 'Black Ops One'; color: #facc15; margin: 0; font-size: 18px;">TEAM PHANTOM</h2>
        <p style="font-family: 'Orbitron'; color: #34d399; margin: 2px 0 0 0; font-size: 11px;">PRACTICE HUB CONVERTER</p>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px;">
      <div>
        <label>TEST TIME (MINUTES)</label>
        <input id="testTimeInput" type="number" value="120">
      </div>
      <div>
        <label>POSITIVE MARKS</label>
        <input id="posMarksInput" type="number" step="0.01" value="0.83">
      </div>
      <div>
        <label>NEGATIVE MARKS</label>
        <input id="negMarksInput" type="number" step="0.01" value="0.27">
      </div>
    </div>
    
    <label>PASTE TESTBOOK RAW JSON DATA</label>
    <textarea id="jsonInput" rows="8" placeholder='{ "success": true, "data": { ... } }'></textarea>
    
    <button onclick="generateQuiz()" style="width: 100%; padding: 14px; background: #06b6d4; color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-family: 'Orbitron';">GENERATE & DOWNLOAD CBT QUIZ (.HTML)</button>

        alert("CLEARANCE REFUSED: INVALID CREDENTIALS");
