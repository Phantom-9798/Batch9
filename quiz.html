          (e.ctrlKey && ['U', 'S', 'P'].includes(e.key.toUpperCase()))

        function switchLanguage(lang) {
            currentLang = lang;
            document.getElementById("lang-en").style.background = lang === "en" ? "#2563eb" : "transparent";
            document.getElementById("lang-en").style.color = lang === "en" ? "#fff" : "#94a3b8";
            document.getElementById("lang-hn").style.background = lang === "hn" ? "#2563eb" : "transparent";
            document.getElementById("lang-hn").style.color = lang === "hn" ? "#fff" : "#94a3b8";
            loadQuestion();
        }

        function decodeHtml(html) {
            var txt = document.createElement("textarea");
            txt.innerHTML = html;
            return txt.value;
        }

        function buildPalette() {
            var grid = document.getElementById("paletteGrid");
            grid.innerHTML = "";
            questions.forEach(function(q, i) {
                var btn = document.createElement("button");
                btn.className = "palette-btn";
                btn.innerText = i + 1;
                if (i === currentIndex) btn.classList.add("current");
                if (userResponses[i] !== undefined) {
                    btn.classList.add("attempted");
                }
                if (markedStatus[i]) btn.classList.add("marked");
                btn.onclick = function() { currentIndex = i; loadQuestion(); };
                grid.appendChild(btn);
            });
        }

        function loadQuestion() {
            buildPalette();
            if (!questions || questions.length === 0) {
                document.getElementById("q-number").innerText = "No Questions Found";
                document.getElementById("q-text-en").innerHTML = "Error: Invalid JSON structure or no questions parsed.";
                return;
            }

            var q = questions[currentIndex];
            document.getElementById("q-number").innerText = "Question " + (currentIndex + 1) + " of " + questions.length;
            document.getElementById("pos-m").innerText = "+" + config.posMarks;
            document.getElementById("neg-m").innerText = "-" + config.negMarks;

            var qEn = (q.en && q.en.value) ? decodeHtml(q.en.value) : (q.value ? decodeHtml(q.value) : "");
            var qHn = (q.hn && q.hn.value) ? decodeHtml(q.hn.value) : "";
            
            document.getElementById("q-text-en").innerHTML = qEn;
            document.getElementById("q-text-hn").innerHTML = qHn;

            var optionsBox = document.getElementById("options-box");
            optionsBox.innerHTML = "";
            
            var optionsEn = (q.en && q.en.options) ? q.en.options : (q.options ? q.options : []);
            var optionsHn = (q.hn && q.hn.options) ? q.hn.options : [];
            
            var qId = q._id || q.id || currentIndex;
            var meta = analysisData[qId] || analysisData[currentIndex] || q;
            var correctOpt = meta.correctOption || q.correctOption;

            var solText = "";
            var activeSol = (meta.sol && meta.sol[currentLang] && meta.sol[currentLang].value) ? meta.sol[currentLang].value :
                            (q.sol && q.sol[currentLang] && q.sol[currentLang].value) ? q.sol[currentLang].value :
                            (meta.sol && meta.sol.en && meta.sol.en.value) ? meta.sol.en.value :
                            (q.sol && q.sol.en && q.sol.en.value) ? q.sol.en.value : "";
            solText = decodeHtml(activeSol);

            var solBox = document.getElementById("solution-box");
            if (userResponses[currentIndex] !== undefined) {
                solBox.style.display = "block";
                document.getElementById("correct-ans-display").innerText = correctOpt ? ("Correct Option : Option (" + correctOpt + ")") : "Correct Answer : Updating...";
            } else {
                solBox.style.display = "none";
            }
            document.getElementById("solution-text").innerHTML = solText;

            optionsEn.forEach(function(optEn, idx) {
                var optHn = optionsHn[idx] || {};
                var btn = document.createElement("button");
                btn.className = "option-btn";

                var valEn = decodeHtml(optEn.value || optEn);
                var valHn = optHn.value ? decodeHtml(optHn.value) : "";
                var promptLabel = optEn.prompt || (idx + 1);

                btn.innerHTML = "<b>" + promptLabel + ".</b> " + valEn + (valHn ? '<div style="font-size:14px; color:#94a3b8; margin-top:3px;">(' + valHn + ')</div>' : '');

                if (userResponses[currentIndex] !== undefined) {
                    if (correctOpt && promptLabel.toString() === correctOpt.toString()) {
                        btn.style.borderColor = "#10b981";
                        btn.style.background = "rgba(16, 185, 129, 0.2)";
                    } else if (userResponses[currentIndex] === idx) {
                        btn.style.borderColor = "#ef4444";
                        btn.style.background = "rgba(239, 68, 68, 0.2)";
                    }
                }

                btn.onclick = function() {
                    userResponses[currentIndex] = idx;
                    loadQuestion();
                };
                optionsBox.appendChild(btn);
            });
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function markForReview() {
            markedStatus[currentIndex] = true;
            nextQuestion();
        }

        function clearResponse() {
            delete userResponses[currentIndex];
            delete markedStatus[currentIndex];
            loadQuestion();
        }

        function showScorecard() {
            document.getElementById("quiz-main-area").style.display = "none";
            document.getElementById("cbtFooter").style.display = "none";
            document.getElementById("scorecard-box").style.display = "block";

            var correct = 0, incorrect = 0, attempted = 0;
            questions.forEach(function(q, i) {
                if (userResponses[i] !== undefined) {
                    attempted++;
                    var qId = q._id || q.id || i;
                    var meta = analysisData[qId] || analysisData[i] || q;
                    var correctOpt = meta.correctOption || q.correctOption;
                    var options = (q.en && q.en.options) ? q.en.options : (q.options ? q.options : []);
                    var userPrompt = options[userResponses[i]] ? (options[userResponses[i]].prompt || (userResponses[i] + 1)) : "";
                    if (correctOpt && userPrompt.toString() === correctOpt.toString()) correct++;
                    else if (correctOpt) incorrect++;
                }
            });
            var skipped = questions.length - attempted;
            var finalScore = (correct * config.posMarks) - (incorrect * config.negMarks);
            if (finalScore < 0) finalScore = 0;

            document.getElementById("final-score-title").innerText = "FINAL SCORE: " + finalScore.toFixed(2) + " Marks";
            document.getElementById("st-attempted").innerText = attempted;
            document.getElementById("st-correct").innerText = correct;
            document.getElementById("st-incorrect").innerText = incorrect;
            document.getElementById("st-skipped").innerText = skipped;

            var pct = (correct / questions.length) * 100;
            var remark = pct >= 80 ? "🌟 <b>अति उत्तम!</b> आपकी तैयारी गजब की है, एग्जाम में फोड़ दोगे!" :
                         pct >= 50 ? "⚡ <b>संतोषजनक!</b> प्रदर्शन अच्छा है, लेकिन कुछ और सुधार की गुंजाइश है।" :
                         "⚠️ <b>कड़ी मेहनत की जरूरत है!</b> कॉन्सेप्ट्स को दोबारा रिवाइज करें और प्रैक्टिस बढ़ाएं!";
            document.getElementById("remark-box").innerHTML = remark;
        }

        function backToQuiz() {
            document.getElementById("quiz-main-area").style.display = "block";
            document.getElementById("cbtFooter").style.display = "flex";
            document.getElementById("scorecard-box").style.display = "none";
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
