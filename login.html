<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script>
  (() => {
    // 1. Right Click Disable
    document.addEventListener('contextmenu', e => e.preventDefault());

    // 2. Keyboard Shortcuts Block (F12, Inspect, View Source)
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && ['U', 'S', 'P'].includes(e.key.toUpperCase()))
      ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    });

    // 3. DevTools Freezing Trap
    setInterval(() => {
      const start = performance.now();
      debugger;
      const end = performance.now();
      if (end - start > 100) {
        document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:20%;">Security Alert: Developer Tools Detected. Access Denied.</h2>';
      }
    }, 1000);

    // 4. Console Auto Clear
    setInterval(() => {
      console.clear();
    }, 1500);
  })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM | Cadet Access Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Chakra+Petch:wght@700;800&family=Orbitron:wght@700;800;900&family=Rajdhani:wght@700;800&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {  
      getAuth,  
      signInWithEmailAndPassword,  
      createUserWithEmailAndPassword,  
      signOut,
      sendPasswordResetEmail  
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {  
      getFirestore,  
      doc,  
      setDoc,  
      getDoc,  
      updateDoc,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3RVHxAfzduyURhBYafmDKyUjVdUQXYtk",
      authDomain: "team-phantom-enrollment.firebaseapp.com",
      projectId: "team-phantom-enrollment",
      storageBucket: "team-phantom-enrollment.firebasestorage.app",
      messagingSenderId: "658049687096",
      appId: "1:658049687096:web:8464788a43126a6bced0cd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.authAction = async function(event) {
      event.preventDefault();
      const email = document.getElementById('cadetEmail').value.trim();
      const password = document.getElementById('cadetPassword').value.trim();
      const statusAlert = document.getElementById('statusAlert');
      const submitBtn = document.getElementById('submitBtn');

      statusAlert.classList.add('hidden');
      submitBtn.disabled = true;

      try {
        if (window.isRegisterMode) {
          const name = document.getElementById('cadetName').value.trim();
          const selectedCheckboxes = document.querySelectorAll('input[name="cadetBatches"]:checked');
          const chosenBatches = Array.from(selectedCheckboxes).map(cb => cb.value);

          if (!name) throw new Error("Please provide your full cadet name.");
          if (chosenBatches.length === 0) throw new Error("Please select at least one training batch.");
          if (!password || password.length < 6) throw new Error("Password must be at least 6 characters long.");

          const q = query(collection(db, "cadets"), where("email", "==", email));
          const querySnapshot = await getDocs(q);
          if (!querySnapshot.empty) {
            throw new Error("This email is already registered. Please proceed to login.");
          }

          let finalAllowed = [...chosenBatches];
          if (chosenBatches.includes("combo")) {
            finalAllowed = ["cds-math", "cds-kilo", "afcat", "capf", "combo"];
          }

          const userCredential = await createUserWithEmailAndPassword(auth, email, password);
          const cadetUid = userCredential.user.uid;

          // Save account with status "pending" so admin review is required
          await setDoc(doc(db, "cadets", cadetUid), {
            uid: cadetUid,
            name: name,
            email: email,
            targetBatch: chosenBatches.join(", "),
            status: "pending",
            allowedBatches: finalAllowed,
            createdAt: new Date().toISOString()
          });

          // Sign out immediately so new signups cannot enter without admin approval
          await signOut(auth);

          statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-amber-950/90 border border-amber-500/80 text-amber-200 block text-left leading-relaxed shadow-lg font-body font-bold";
          statusAlert.innerHTML = `
            <div class="flex items-center gap-2 font-orbitron font-extrabold text-amber-300 mb-1 text-sm tracking-wide">
              <span>&#9888;</span> REGISTRATION PENDING APPROVAL
            </div>
            Cadet <b>${name}</b>, your account has been registered successfully! Your account is currently <b>pending administrative approval</b>. You will be able to log in once your enrollment is verified.
          `;
          statusAlert.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerText = "INITIALIZE SIGNUP";

        } else {
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          const user = userCredential.user;

          const cadetRef = doc(db, "cadets", user.uid);
          const cadetDoc = await getDoc(cadetRef);

          if (!cadetDoc.exists()) {
            throw new Error("Cadet record not found in tactical database.");
          }

          const cadetData = cadetDoc.data();
          if (cadetData.status !== "active") {
            throw new Error("Your account is currently pending administrative activation.");
          }

          establishSessionAndEnter(user.uid);
        }
      } catch (error) {
        statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-red-950/90 border border-red-500/80 text-red-200 block text-left leading-relaxed font-body font-bold";
        statusAlert.innerHTML = `<span class="font-black text-red-300">ACCESS DENIED:</span> ${error.message}`;
        statusAlert.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = window.isRegisterMode ? "INITIALIZE SIGNUP" : "AUTHORIZE & LOGIN";
      }
    };

    async function establishSessionAndEnter(uid) {
      const statusAlert = document.getElementById('statusAlert');
      try {
        const cadetRef = doc(db, "cadets", uid);
        const newSessionToken = "sess_" + Date.now() + "_" + Math.random().toString(36).substring(2, 9);
        
        localStorage.setItem("phantom_session_token", newSessionToken);
        localStorage.setItem("phantom_uid", uid);

        await updateDoc(cadetRef, {
          activeSession: newSessionToken,
          lastLoginAt: new Date().toISOString()
        });

        statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-emerald-950/90 border border-emerald-500/80 text-emerald-200 block text-center font-orbitron font-black tracking-wider shadow-lg";
        statusAlert.innerText = "ACCESS GRANTED. INITIALIZING DASHBOARD...";
        statusAlert.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = "classroom.html";
        }, 700);

      } catch (err) {
        statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-red-950/90 border border-red-500/80 text-red-200 block text-left leading-relaxed font-body font-bold";
        statusAlert.innerHTML = `<span class="font-black text-red-300">ERROR:</span> ${err.message}`;
        statusAlert.classList.remove('hidden');
      }
    }

    window.forgotPasswordAction = async function() {
      const email = document.getElementById('cadetEmail').value.trim();
      const statusAlert = document.getElementById('statusAlert');
      
      if (!email) {
        statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-amber-950/90 border border-amber-500/80 text-amber-200 block text-left leading-relaxed font-body font-bold";
        statusAlert.innerHTML = `<span class="font-black text-amber-300">NOTICE:</span> Please enter your registered Email Address above first, then click Forgot Password.`;
        statusAlert.classList.remove('hidden');
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-emerald-950/90 border border-emerald-500/80 text-emerald-200 block text-left leading-relaxed font-body font-bold";
        statusAlert.innerHTML = `<b>Password Reset Dispatched:</b> A reset link has been sent to <b>${email}</b>. Check your inbox.`;
        statusAlert.classList.remove('hidden');
      } catch (error) {
        statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-red-950/90 border border-red-500/80 text-red-200 block text-left leading-relaxed font-body font-bold";
        statusAlert.innerHTML = `<span class="font-black text-red-300">ERROR:</span> ${error.message}`;
        statusAlert.classList.remove('hidden');
      }
    };
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
    }

    /* Force Full Solid Deep Navy Blue Background */
    html, body {
      background-color: #020617 !important;
      background-image: linear-gradient(135deg, #020617 0%, #081229 50%, #0b1d45 100%) !important;
      color: #ffffff !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Falling Stars & Bubbles Canvas Layer */
    #starBubbleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; font-weight: 900; }
    .font-chakra { font-family: 'Chakra Petch', sans-serif; font-weight: 800; }
    .font-body { font-family: 'Inter', sans-serif; font-weight: 700; }
    .font-serif-bold { font-family: Georgia, Cambria, "Times New Roman", Times, serif; font-weight: 700; }

    .hud-grid {
      background-image: 
        linear-gradient(rgba(255, 215, 0, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 215, 0, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Gorgeous Yellow/Gold Highlighted Armor Login Box */
    .armor-card {
      background: rgba(6, 12, 30, 0.96);
      border: 2px solid rgba(255, 215, 0, 0.7);
      box-shadow: 0 0 60px rgba(255, 215, 0, 0.25), inset 0 0 25px rgba(255, 215, 0, 0.15);
      position: relative;
      z-index: 10;
    }

    /* Moving Blue/Red Glowing Hover Light Effect on All Buttons & Clickable Elements */
    .phantom-btn {
      transition: all 0.3s ease-in-out;
      position: relative;
    }
    .phantom-btn:hover {
      background-color: #0ea5e9 !important;
      color: #ffffff !important;
      border-color: #38bdf8 !important;
      box-shadow: 0 0 25px #0ea5e9, 0 0 50px #38bdf8, inset 0 0 15px rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }
    .phantom-btn:active {
      transform: scale(0.96);
    }

    header, main, footer {
      position: relative;
      z-index: 10;
    }
  </style>
</head>

<body class="hud-grid text-white min-h-screen flex flex-col justify-between">

  <!-- Background Canvas for Falling Stars & Medium Bubbles -->
  <canvas id="starBubbleCanvas"></canvas>

  <!-- TOP MILITARY BRANDING HEADER -->
  <header class="w-full pt-10 pb-4 px-4">

        <img src="logo.jpeg" alt="Team Phantom Logo" class="w-full h-full object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/150/020617/ffd700?text=PHANTOM';">

  <!-- AUTHENTICATION CONSOLE -->
  <main class="flex-grow flex items-center justify-center px-4 py-6">
    <div class="w-full max-w-md">

      <!-- Yellow Highlighted Login Box -->
      <div class="armor-card rounded-2xl p-6 sm:p-8 backdrop-blur-xl relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-3.5 h-3.5 border-t-2 border-l-2 border-amber-400"></div>
        <div class="absolute top-0 right-0 w-3.5 h-3.5 border-t-2 border-r-2 border-amber-400"></div>
        <div class="absolute bottom-0 left-0 w-3.5 h-3.5 border-b-2 border-l-2 border-amber-400"></div>

        <!-- MODE SELECTION TABS -->
        <div class="grid grid-cols-2 gap-2 p-1.5 bg-black/90 rounded-xl border border-amber-500/40 mb-6 font-orbitron text-xs">
          <button type="button" id="tabLogin" onclick="switchMode('login')" class="py-3 rounded-lg bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-black tracking-wider transition shadow-lg cursor-pointer phantom-btn">

        </div>

        <!-- CREDENTIAL FORM -->
        <form id="authForm" onsubmit="window.authAction(event)" class="space-y-4 font-body">
          
          <div id="nameField" class="hidden">
            <label class="block text-xs uppercase tracking-wider text-amber-200 font-black mb-1.5 font-serif-bold text-sm">
              Cadet Full Name
            </label>
            <input type="text" id="cadetName" placeholder="e.g. Vikram Sharma" class="w-full bg-neutral-900/95 border-2 border-amber-500/50 rounded-lg px-3.5 py-3 text-sm font-bold text-white placeholder-neutral-400 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/60 transition shadow-inner">
          </div>

          <div>
            <label class="block text-xs uppercase tracking-wider text-amber-200 font-black mb-1.5 font-serif-bold text-sm">
              Registered Email Address
            </label>
            <input type="email" id="cadetEmail" required placeholder="cadet@example.com" class="w-full bg-neutral-900/95 border-2 border-amber-500/50 rounded-lg px-3.5 py-3 text-sm font-bold text-white placeholder-neutral-400 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/60 transition shadow-inner">
          </div>

          <!-- Password Field with Forgot Link -->
          <div id="passwordSection">
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs uppercase tracking-wider text-amber-200 font-black font-serif-bold text-sm">
                Password
              </label>
              <button type="button" id="forgotBtn" onclick="window.forgotPasswordAction()" class="text-[11px] font-orbitron font-black text-amber-400 hover:text-amber-300 tracking-wider uppercase focus:outline-none cursor-pointer transition">
                FORGOT?
              </button>
            </div>
            <input type="password" id="cadetPassword" required placeholder="••••••••" class="w-full bg-neutral-900/95 border-2 border-amber-500/50 rounded-lg px-3.5 py-3 text-sm font-bold text-white placeholder-neutral-400 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/60 transition shadow-inner">
          </div>

          <div id="batchField" class="hidden">
            <label class="block text-xs uppercase tracking-wider text-amber-200 font-black mb-1.5 font-serif-bold text-sm flex items-center justify-between">

              <span class="text-[11px] text-amber-400 font-mono font-bold">Multiple Select</span>
            </label>

              <label class="flex items-center gap-2.5 p-3 rounded-lg bg-neutral-900/90 border border-amber-900/60 hover:border-amber-400 cursor-pointer transition shadow-sm">
                <input type="checkbox" name="cadetBatches" value="cds-math" class="w-4 h-4 accent-amber-400 rounded cursor-pointer">
                <span class="text-white font-serif-bold text-sm">CDS Mathematics Specialist</span>
              </label>
              <label class="flex items-center gap-2.5 p-3 rounded-lg bg-neutral-900/90 border border-amber-900/60 hover:border-amber-400 cursor-pointer transition shadow-sm">

                <span class="text-white font-serif-bold text-sm">CDS OTA Batch</span>
              </label>
              <label class="flex items-center gap-2.5 p-3 rounded-lg bg-neutral-900/90 border border-amber-900/60 hover:border-amber-400 cursor-pointer transition shadow-sm">
                <input type="checkbox" name="cadetBatches" value="afcat" class="w-4 h-4 accent-amber-400 rounded cursor-pointer">
                <span class="text-white font-serif-bold text-sm">AFCAT</span>
              </label>
              <label class="flex items-center gap-2.5 p-3 rounded-lg bg-neutral-900/90 border border-amber-900/60 hover:border-amber-400 cursor-pointer transition shadow-sm">
                <input type="checkbox" name="cadetBatches" value="Mock Test" class="w-4 h-4 accent-amber-400 rounded cursor-pointer">

                <span class="text-white font-serif-bold text-sm">CAPF</span>
              </label>
              <label class="flex items-center gap-2.5 p-3 rounded-lg bg-amber-950/60 border border-amber-500/80 hover:border-amber-400 cursor-pointer transition shadow-sm">
                <input type="checkbox" name="cadetBatches" value="combo" class="w-4 h-4 accent-amber-400 rounded cursor-pointer">

            AUTHORIZE & LOGIN

  <footer class="bg-black/95 border-t border-amber-900/60 py-4 text-center text-xs font-rajdhani font-bold tracking-widest text-amber-300">
    TEAM PHANTOM &bull; SECURE SINGLE-DEVICE PROTOCOL &bull; &copy; 2026
  </footer>

  <script>
    // Vibrant Medium Bubbles & Highly Visible Glowing Stars Canvas Animation Engine
    const canvas = document.getElementById("starBubbleCanvas");
    const ctx = canvas.getContext("2d");
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const particles = [];
    for (let i = 0; i < 90; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 4 + 2.5,  // Medium bubble size
        starRadius: Math.random() * 4 + 3, // Clearly visible big glowing star size
        speedY: Math.random() * 0.9 + 0.3,
        speedX: (Math.random() - 0.5) * 0.4,
        opacity: Math.random() * 0.9 + 0.4,
        isBubble: Math.random() > 0.45
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y > canvas.height) {
          p.y = -20;
          p.x = Math.random() * canvas.width;
        }
        ctx.beginPath();
        if (p.isBubble) {
          // Medium transparent bubbles
          ctx.arc(p.x, p.y, p.radius * 1.5, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(56, 189, 248, ${p.opacity * 0.85})`;
          ctx.lineWidth = 1.6;
          ctx.stroke();
        } else {
          // Bright glowing golden/white stars clearly visible
          ctx.arc(p.x, p.y, p.starRadius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 223, 0, ${p.opacity})`;
          ctx.shadowBlur = 25;
          ctx.shadowColor = '#ffd700';
          ctx.fill();
        }
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    window.isRegisterMode = false;

    function switchMode(mode) {
      const nameField = document.getElementById('nameField');
      const batchField = document.getElementById('batchField');
      const forgotBtn = document.getElementById('forgotBtn');
      const submitBtn = document.getElementById('submitBtn');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const statusAlert = document.getElementById('statusAlert');
      
      statusAlert.classList.add('hidden');

      if (mode === 'register') {
        window.isRegisterMode = true;
        nameField.classList.remove('hidden');
        batchField.classList.remove('hidden');
        if (forgotBtn) forgotBtn.classList.add('hidden');
        submitBtn.innerText = "INITIALIZE SIGNUP";
        
        tabRegister.className = "py-3 rounded-lg bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-black tracking-wider transition shadow-lg cursor-pointer phantom-btn";
        tabLogin.className = "py-3 rounded-lg text-neutral-300 hover:text-white font-extrabold tracking-wider transition cursor-pointer phantom-btn";
      } else {
        window.isRegisterMode = false;
        nameField.classList.add('hidden');
        batchField.classList.add('hidden');
        if (forgotBtn) forgotBtn.classList.remove('hidden');
        submitBtn.innerText = "AUTHORIZE & LOGIN";

        tabLogin.className = "py-3 rounded-lg bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-black tracking-wider transition shadow-lg cursor-pointer phantom-btn";
        tabRegister.className = "py-3 rounded-lg text-neutral-300 hover:text-white font-extrabold tracking-wider transition cursor-pointer phantom-btn";
      }
    }
  </script>

</body>
