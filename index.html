<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script>
  (() => {
    // 1. Right Click Disable
    document.addEventListener('contextmenu', e => e.preventDefault());

    // 2. Keyboard Shortcuts Block (F12, Inspect, View Source)
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
        (e.ctrlKey && ['U', 'S', 'P'].includes(e.key.toUpperCase()))
      ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    });

    // 3. DevTools Freezing Trap
    setInterval(() => {
      const start = performance.now();
      debugger;
      const end = performance.now();
      if (end - start > 100) {
        document.body.innerHTML = '<h2 style="color:red;text-align:center;margin-top:20%;">Security Alert: Developer Tools Detected. Access Denied.</h2>';
      }
    }, 1000);

    // 4. Console Auto Clear
    setInterval(() => {
      console.clear();
    }, 1500);
  })();
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEAM PHANTOM | Cadet Access Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Military Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {  
      getFirestore,  
      doc,  
      setDoc,  
      getDoc,  
      updateDoc,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Team Phantom Official Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD3RVHxAfzduyURhBYafmDKyUjVdUQXYtk",
      authDomain: "team-phantom-enrollment.firebaseapp.com",
      projectId: "team-phantom-enrollment",
      storageBucket: "team-phantom-enrollment.firebasestorage.app",
      messagingSenderId: "658049687096",
      appId: "1:658049687096:web:8464788a43126a6bced0cd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Global variables for OTP flow
    window.generatedOtp = null;
    window.pendingCadetData = null;

    // Helper function to send email via Vercel Serverless Function (No IP Block)
    async function sendBrevoOtpEmail(recipientEmail, otpCode, cadetName) {
      try {
        const response = await fetch('/api/send-otp', {
          method: 'POST',
          headers: {
            'content-type': 'application/json'
          },
          body: JSON.stringify({
            email: recipientEmail,
            otpCode: otpCode
          })
        });
        const data = await response.json();
        return response.ok && data.success;
      } catch (err) {
        console.error("Serverless OTP dispatch error:", err);
        return false;
      }
    }

    window.authAction = async function(event) {
      event.preventDefault();
      const email = document.getElementById('cadetEmail').value.trim();
      const statusAlert = document.getElementById('statusAlert');
      const submitBtn = document.getElementById('submitBtn');
      const otpSection = document.getElementById('otpSection');
      const resendContainer = document.getElementById('resendContainer');

      statusAlert.classList.add('hidden');
      submitBtn.disabled = true;

      try {
        if (window.isRegisterMode) {
          // --- NEW CADET SIGNUP ---
          const name = document.getElementById('cadetName').value.trim();
          const selectedCheckboxes = document.querySelectorAll('input[name="cadetBatches"]:checked');
          const chosenBatches = Array.from(selectedCheckboxes).map(cb => cb.value);

          if (!name) throw new Error("Please provide your full cadet name.");
          if (chosenBatches.length === 0) throw new Error("Please select at least one training batch.");

          const q = query(collection(db, "cadets"), where("email", "==", email));
          const querySnapshot = await getDocs(q);
          if (!querySnapshot.empty) {
            throw new Error("This email is already registered. Please proceed to login.");
          }

          let finalAllowed = [...chosenBatches];
          if (chosenBatches.includes("combo")) {
            finalAllowed = ["cds-math", "cds-kilo", "afcat", "capf", "combo"];
          }

          const cadetUid = "cadet_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);

          await setDoc(doc(db, "cadets", cadetUid), {
            uid: cadetUid,
            name: name,
            email: email,
            targetBatch: chosenBatches.join(", "),
            status: "pending",
            allowedBatches: finalAllowed,
            createdAt: new Date().toISOString()
          });

          statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-amber-950/80 border border-amber-500/60 text-amber-200 block text-left leading-relaxed shadow-lg";
          statusAlert.innerHTML = `
            <div class="flex items-center gap-2 font-orbitron font-bold text-amber-400 mb-1 text-sm tracking-wide">
              <span>&#9888;</span> REGISTRATION RECORDED
            </div>
            Cadet <b>${name}</b>, your account status is: <span class="bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-mono font-bold">PENDING ACTIVATION</span>.<br>
            Your access request has been submitted to administration for verification.
          `;
          submitBtn.disabled = false;
          submitBtn.innerText = "CADET ENROLLED";

        } else {
          // --- CADET LOGIN: STEP 1 - SEND OTP ---
          const cadetQuery = query(collection(db, "cadets"), where("email", "==", email));
          const cadetSnapshot = await getDocs(cadetQuery);

          if (cadetSnapshot.empty) {
            throw new Error("Cadet record not registered in tactical database. Please sign up first.");
          }

          const cadetDocData = cadetSnapshot.docs[0].data();
          window.pendingCadetData = { id: cadetSnapshot.docs[0].id, ...cadetDocData };

          if (cadetDocData.status !== "active") {
            statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-amber-950/80 border border-amber-500/60 text-amber-200 block text-left leading-relaxed shadow-lg";
            statusAlert.innerHTML = `
              <div class="flex items-center gap-2 font-orbitron font-bold text-amber-400 mb-1 text-sm tracking-wide">
                <span>&#9888;</span> PENDING ACTIVATION
              </div>
              Your account is currently pending administrative verification. Please wait for activation.
            `;
            submitBtn.disabled = false;
            submitBtn.innerText = "SEND LOGIN OTP";
            return;
          }

          // Generate 6-digit OTP
          window.generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
          
          submitBtn.innerText = "DISPATCHING OTP...";
          const emailSent = await sendBrevoOtpEmail(email, window.generatedOtp, cadetDocData.name);

          if (!emailSent) {
            throw new Error("Failed to dispatch OTP via serverless gateway. Please check email address or configuration.");
          }

          // Show OTP Input & Resend Option
          otpSection.classList.remove('hidden');
          resendContainer.classList.remove('hidden');
          document.getElementById('cadetEmail').disabled = true;
          submitBtn.innerText = "VERIFY OTP & ENTER";
          submitBtn.onclick = window.verifyOtpAction;
          submitBtn.disabled = false;

          statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-emerald-950/80 border border-emerald-500/60 text-emerald-300 block text-left leading-relaxed";
          statusAlert.innerHTML = `<b>OTP Dispatched:</b> A 6-digit verification code has been sent to <b>${email}</b>. Enter it below to access the portal.`;
        }
      } catch (error) {
        statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-red-950/80 border border-red-500/60 text-red-200 block text-left leading-relaxed";
        statusAlert.innerHTML = `<span class="font-bold text-red-400">ERROR:</span> ${error.message}`;
        submitBtn.disabled = false;
        submitBtn.innerText = window.isRegisterMode ? "INITIALIZE SIGNUP" : "SEND LOGIN OTP";
      }
    };

    // --- RESEND OTP HANDLER ---
    window.resendOtpCode = async function() {
      if (!window.pendingCadetData) return;
      const statusAlert = document.getElementById('statusAlert');
      
      window.generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
      statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-amber-950/80 border border-amber-500/60 text-amber-200 block text-left leading-relaxed";
      statusAlert.innerHTML = `<b>Resending OTP...</b> Dispatching a fresh verification code to <b>${window.pendingCadetData.email}</b>.`;

      const emailSent = await sendBrevoOtpEmail(window.pendingCadetData.email, window.generatedOtp, window.pendingCadetData.name);
      
      if (emailSent) {
        statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-emerald-950/80 border border-emerald-500/60 text-emerald-300 block text-left leading-relaxed";
        statusAlert.innerHTML = `<b>Fresh OTP Dispatched:</b> A new 6-digit verification code has been sent to your email.`;
      } else {
        statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-red-950/80 border border-red-500/60 text-red-200 block text-left leading-relaxed";
        statusAlert.innerHTML = `<span class="font-bold text-red-400">ERROR:</span> Failed to resend OTP. Please try again.`;
      }
    };

    // --- CADET LOGIN: STEP 2 - VERIFY OTP & SINGLE-DEVICE SESSION ---
    window.verifyOtpAction = async function(event) {
      event.preventDefault();
      const enteredOtp = document.getElementById('cadetOtp').value.trim();
      const statusAlert = document.getElementById('statusAlert');
      const submitBtn = document.getElementById('submitBtn');

      if (enteredOtp !== window.generatedOtp) {
        statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-red-950/80 border border-red-500/60 text-red-200 block text-left leading-relaxed";
        statusAlert.innerHTML = `<span class="font-bold text-red-400">ERROR:</span> Invalid OTP code. Please check your inbox and try again.`;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "VERIFYING SESSION...";

      try {
        const cadetRef = doc(db, "cadets", window.pendingCadetData.id);
        const newSessionToken = "sess_" + Date.now() + "_" + Math.random().toString(36).substring(2, 9);
        
        localStorage.setItem("phantom_session_token", newSessionToken);
        localStorage.setItem("phantom_uid", window.pendingCadetData.id);

        await updateDoc(cadetRef, {
          activeSession: newSessionToken,
          lastLoginAt: new Date().toISOString()
        });

        statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-emerald-950/80 border border-emerald-500/60 text-emerald-300 block text-center font-orbitron font-bold tracking-wider";
        statusAlert.innerText = "IDENTITY CONFIRMED. ACCESS GRANTED...";

        setTimeout(() => {
          window.location.href = "classroom.html";
        }, 700);

      } catch (err) {
        statusAlert.className = "mt-5 p-4 rounded-xl text-xs bg-red-950/80 border border-red-500/60 text-red-200 block text-left leading-relaxed";
        statusAlert.innerHTML = `<span class="font-bold text-red-400">ERROR:</span> ${err.message}`;
        submitBtn.disabled = false;
        submitBtn.innerText = "VERIFY OTP & ENTER";
      }
    };
  </script>

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #05080c;
    }
    .font-stencil { font-family: 'Black Ops One', cursive; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-body { font-family: 'Inter', sans-serif; }

    .tactical-bg {
      background: 
        radial-gradient(circle at 50% 10%, rgba(239, 68, 68, 0.22) 0%, transparent 55%),
        radial-gradient(circle at 15% 45%, rgba(14, 165, 233, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 85% 65%, rgba(234, 179, 8, 0.16) 0%, transparent 45%),
        linear-gradient(180deg, rgba(4, 7, 13, 0.93) 0%, rgba(2, 4, 7, 0.98) 100%),
        url('https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=2000&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .hud-grid {
      background-image: 
        linear-gradient(rgba(245, 158, 11, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 158, 11, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    .armor-card {
      background: rgba(10, 15, 20, 0.94);
      border: 1px solid rgba(245, 158, 11, 0.4);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), inset 0 0 20px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>

<body class="tactical-bg hud-grid text-neutral-100 min-h-screen flex flex-col justify-between">

  <!-- TOP MILITARY BRANDING HEADER -->
  <header class="w-full pt-10 pb-4 px-4">
    <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-center gap-6 md:gap-8">
      
      <!-- LOGO BADGE -->
      <div class="relative w-28 h-28 md:w-32 md:h-32 rounded-2xl bg-black/90 border-2 border-amber-500/80 p-1.5 shadow-[0_0_35px_rgba(245,158,11,0.35)] shrink-0 flex items-center justify-center">
        <img src="logo.jpeg" alt="Team Phantom Logo" class="w-full h-full object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/150/000000/f59e0b?text=PHANTOM';">
        <div class="absolute -bottom-2.5 bg-amber-500 text-black font-orbitron font-extrabold text-[9px] px-2 py-0.5 rounded tracking-widest uppercase shadow">
          ARMED FORCES
        </div>
      </div>

      <!-- TITLE & SERVICE TAGS -->
      <div class="text-center md:text-left">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-950/60 border border-red-500/40 text-red-400 text-xs font-orbitron font-bold tracking-widest uppercase mb-2">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
          ARMY &bull; NAVY &bull; AIR FORCE
        </div>
        <h1 class="font-stencil text-5xl sm:text-6xl md:text-7xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-amber-400 to-yellow-300 drop-shadow-[0_4px_25px_rgba(0,0,0,0.95)]">
          TEAM PHANTOM
        </h1>
        <p class="font-rajdhani text-base sm:text-lg font-bold uppercase tracking-widest text-neutral-300 mt-1 flex items-center justify-center md:justify-start gap-2">
          <span class="text-amber-500">&#9733;</span> OFFICIAL CADET HEADQUARTERS <span class="text-amber-500">&#9733;</span>
        </p>
      </div>

    </div>
  </header>

  <!-- AUTHENTICATION CONSOLE -->
  <main class="flex-grow flex items-center justify-center px-4 py-6">
    <div class="w-full max-w-md">

      <div class="armor-card rounded-2xl p-6 sm:p-8 backdrop-blur-xl relative overflow-hidden">
        
        <div class="absolute top-0 left-0 w-3 h-3 border-t-2 border-l-2 border-amber-500"></div>
        <div class="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-amber-500"></div>
        <div class="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-amber-500"></div>
        <div class="absolute bottom-0 right-0 w-3 h-3 border-b-2 border-r-2 border-amber-500"></div>

        <!-- MODE SELECTION TABS -->
        <div class="grid grid-cols-2 gap-2 p-1.5 bg-black/90 rounded-xl border border-neutral-800 mb-6 font-orbitron text-xs">
          <button type="button" id="tabLogin" onclick="switchMode('login')" class="py-2.5 rounded-lg bg-gradient-to-r from-amber-600 to-yellow-500 text-black font-extrabold tracking-wider transition shadow-md">
            CADET LOGIN
          </button>
          <button type="button" id="tabRegister" onclick="switchMode('register')" class="py-2.5 rounded-lg text-neutral-400 hover:text-white font-bold tracking-wider transition">
            NEW SIGNUP
          </button>
        </div>

        <!-- CREDENTIAL FORM -->
        <form id="authForm" onsubmit="window.authAction(event)" class="space-y-4 font-body">
          
          <div id="nameField" class="hidden">
            <label class="block text-xs uppercase tracking-wider text-neutral-300 font-bold mb-1.5 font-rajdhani text-sm">
              Cadet Full Name
            </label>
            <input type="text" id="cadetName" placeholder="e.g. Vikram Sharma" class="w-full bg-neutral-900/95 border border-neutral-700 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-neutral-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500">
          </div>

          <div>
            <label class="block text-xs uppercase tracking-wider text-neutral-300 font-bold mb-1.5 font-rajdhani text-sm">
              Registered Email Address
            </label>
            <input type="email" id="cadetEmail" required placeholder="cadet@example.com" class="w-full bg-neutral-900/95 border border-neutral-700 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-neutral-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500">
          </div>

          <!-- OTP Input Field & Resend Option (Hidden Initially during login) -->
          <div id="otpSection" class="hidden">
            <label class="block text-xs uppercase tracking-wider text-amber-400 font-bold mb-1.5 font-rajdhani text-sm">
              Enter 6-Digit Email OTP
            </label>
            <input type="text" id="cadetOtp" maxlength="6" placeholder="123456" class="w-full bg-neutral-900/95 border border-amber-500/60 rounded-lg px-3.5 py-2.5 text-base text-amber-300 font-mono tracking-widest placeholder-neutral-600 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 text-center">
            
            <div id="resendContainer" class="hidden text-right mt-2">
              <button type="button" onclick="window.resendOtpCode()" class="text-[11px] font-orbitron text-amber-400 hover:text-amber-300 uppercase tracking-wider focus:outline-none underline">
                &raquo; RESEND NEW OTP
              </button>
            </div>
          </div>

          <div id="batchField" class="hidden">
            <label class="block text-xs uppercase tracking-wider text-neutral-300 font-bold mb-1.5 font-rajdhani text-sm flex items-center justify-between">
              <span>Target Training Batch (Select 1 or more)</span>
              <span class="text-[11px] text-amber-400 font-mono">Multiple Select</span>
            </label>
            <div class="grid grid-cols-1 gap-2 text-xs font-rajdhani">
              <label class="flex items-center gap-2.5 p-2.5 rounded-lg bg-neutral-900/80 border border-neutral-800 hover:border-amber-500/50 cursor-pointer transition">
                <input type="checkbox" name="cadetBatches" value="cds-math" class="w-4 h-4 accent-amber-500 rounded cursor-pointer">
                <span class="text-neutral-200 font-bold">CDS Mathematics Specialist</span>
              </label>
              <label class="flex items-center gap-2.5 p-2.5 rounded-lg bg-neutral-900/80 border border-neutral-800 hover:border-amber-500/50 cursor-pointer transition">
                <input type="checkbox" name="cadetBatches" value="cds-kilo" class="w-4 h-4 accent-amber-500 rounded cursor-pointer">
                <span class="text-neutral-200 font-bold">CDS OTA Batch</span>
              </label>
              <label class="flex items-center gap-2.5 p-2.5 rounded-lg bg-neutral-900/80 border border-neutral-800 hover:border-amber-500/50 cursor-pointer transition">
                <input type="checkbox" name="cadetBatches" value="afcat" class="w-4 h-4 accent-amber-500 rounded cursor-pointer">
                <span class="text-neutral-200 font-bold">AFCAT</span>
              </label>
              <label class="flex items-center gap-2.5 p-2.5 rounded-lg bg-neutral-900/80 border border-neutral-800 hover:border-amber-500/50 cursor-pointer transition">
                <input type="checkbox" name="cadetBatches" value="Mock Test" class="w-4 h-4 accent-amber-500 rounded cursor-pointer">
                <span class="text-neutral-200 font-bold">Mock Test</span>
              </label>
              <label class="flex items-center gap-2.5 p-2.5 rounded-lg bg-neutral-900/80 border border-neutral-800 hover:border-amber-500/50 cursor-pointer transition">
                <input type="checkbox" name="cadetBatches" value="capf" class="w-4 h-4 accent-amber-500 rounded cursor-pointer">
                <span class="text-neutral-200 font-bold">CAPF</span>
              </label>
              <label class="flex items-center gap-2.5 p-2.5 rounded-lg bg-amber-950/20 border border-amber-500/40 hover:border-amber-500 cursor-pointer transition">
                <input type="checkbox" name="cadetBatches" value="combo" class="w-4 h-4 accent-amber-500 rounded cursor-pointer">
                <span class="text-amber-300 font-bold">Tri-Service Mega Combo (All Batches)</span>
              </label>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="w-full py-3 mt-3 rounded-lg bg-gradient-to-r from-amber-500 via-amber-400 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-black font-orbitron font-extrabold tracking-wider uppercase text-sm shadow-[0_0_25px_rgba(245,158,11,0.3)] transition transform active:scale-[0.98]">
            SEND LOGIN OTP
          </button>
        </form>

        <div id="statusAlert" class="mt-4 p-3 rounded-lg text-xs hidden border"></div>

      </div>

    </div>
  </main>

  <footer class="bg-black/95 border-t border-neutral-900 py-4 text-center text-xs font-rajdhani tracking-widest text-neutral-500">
    TEAM PHANTOM &bull; SECURE SINGLE-DEVICE PROTOCOL &bull; &copy; 2026
  </footer>

  <script>
    window.isRegisterMode = false;

    function switchMode(mode) {
      const nameField = document.getElementById('nameField');
      const batchField = document.getElementById('batchField');
      const otpSection = document.getElementById('otpSection');
      const resendContainer = document.getElementById('resendContainer');
      const emailInput = document.getElementById('cadetEmail');
      const submitBtn = document.getElementById('submitBtn');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const statusAlert = document.getElementById('statusAlert');
      
      statusAlert.classList.add('hidden');
      emailInput.disabled = false;
      otpSection.classList.add('hidden');
      resendContainer.classList.add('hidden');

      if (mode === 'register') {
        window.isRegisterMode = true;
        nameField.classList.remove('hidden');
        batchField.classList.remove('hidden');
        submitBtn.innerText = "INITIALIZE SIGNUP";
        submitBtn.onclick = null;
        
        tabRegister.className = "py-2.5 rounded-lg bg-gradient-to-r from-amber-600 to-yellow-500 text-black font-extrabold tracking-wider transition shadow-md";
        tabLogin.className = "py-2.5 rounded-lg text-neutral-400 hover:text-white font-bold tracking-wider transition";
      } else {
        window.isRegisterMode = false;
        nameField.classList.add('hidden');
        batchField.classList.add('hidden');
        submitBtn.innerText = "SEND LOGIN OTP";
        submitBtn.onclick = null;

        tabLogin.className = "py-2.5 rounded-lg bg-gradient-to-r from-amber-600 to-yellow-500 text-black font-extrabold tracking-wider transition shadow-md";
        tabRegister.className = "py-2.5 rounded-lg text-neutral-400 hover:text-white font-bold tracking-wider transition";
      }
    }
  </script>

</body>
</html>
