<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020617">
  <title>TEAM PHANTOM</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #020617;
    }
    #teamPhantomApp {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      margin: 0;
      padding: 0;
      background: #020617;
    }
    .fallback {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      background: #020617;
      font: 600 16px/1.5 Arial, sans-serif;
      text-align: center;
    }
    .fallback a { color: #facc15; }
  </style>
</head>
<body>
  <!--
    Single-address SPA shell:
    All original pages stay as separate HTML files. They run inside this
    same-origin frame, so internal page navigation does not change the
    browser address bar from the root URL.
  -->
  <iframe
    id="teamPhantomApp"
    src="intro.html"
    title="TEAM PHANTOM Application"
    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
    allowfullscreen
  ></iframe>
  <noscript>
    <div class="fallback">
      JavaScript is required. <a href="intro.html">Open TEAM PHANTOM</a>
    </div>
  </noscript>
</body>
</html>
