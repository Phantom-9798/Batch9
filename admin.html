<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COMMAND CENTER | SECURE DISPATCH TERMINAL</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">

  <script>
    // ================= TIGHT ADMIN SECURITY =================
    (() => {
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if (
          e.key === 'F12' ||
          (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
          (e.ctrlKey && ['U', 'S', 'P'].includes(e.key.toUpperCase()))
        ) {
          e.preventDefault();
          return false;
        }
      });
      setInterval(() => {
        const start = performance.now();
        debugger;
        if (performance.now() - start > 100) {
          document.body.innerHTML = '<div style="background:#000;color:red;height:100vh;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;">TERMINAL LOCKED: TAMPER DETECTED</div>';
        }
      }, 1000);
    })();
  </script>

  <style>
    body { font-family: 'Rajdhani', sans-serif; background-color: #04070b; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-stencil { font-family: 'Black Ops One', cursive; }
    .terminal-panel {
      background: rgba(10, 15, 22, 0.95);
      border: 1px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body class="min-h-screen text-neutral-100 flex flex-col justify-between p-4">

  <!-- ================= AUTH GATE ================= -->
  <div id="authGate" class="w-full max-w-md mx-auto my-auto terminal-panel rounded-2xl p-6 text-center">
    <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse mx-auto mb-3"></div>
    <h2 class="font-stencil text-2xl text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-amber-400 to-yellow-300 mb-1">
      COMMAND ACCESS GATE
    </h2>
    <p class="font-orbitron text-[10px] text-neutral-400 tracking-widest uppercase mb-5">
      LEVEL-4 PHANTOM CLEARANCE REQUIRED
    </p>
    <input id="adminPass" type="password" placeholder="Enter Clearance Key" class="w-full bg-black border border-neutral-700 focus:border-emerald-500 text-center text-emerald-400 font-mono tracking-widest py-3 rounded-xl outline-none mb-4">
    <button onclick="unlockTerminal()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-orbitron font-bold py-2.5 rounded-xl transition text-xs tracking-wider cursor-pointer">
      VERIFY IDENTITY
    </button>
  </div>

  <!-- ================= MAIN ADMIN CONSOLE ================= -->
  <main id="adminConsole" class="hidden max-w-4xl mx-auto w-full my-6">
    <div class="terminal-panel rounded-2xl p-6">
      
      <!-- Top Title -->
      <div class="flex items-center justify-between border-b border-neutral-800 pb-4 mb-6">
        <div>
          <h1 class="font-stencil text-2xl text-emerald-400 tracking-wider">TACTICAL DISPATCH TERMINAL</h1>
          <p class="font-orbitron text-[10px] text-neutral-400">FIRESTORE CLOUD INTEGRATION PROTOCOL</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
          <span class="text-xs font-mono text-emerald-400 font-bold">LINK ACTIVE</span>
        </div>
      </div>

      <!-- Tab Switcher -->
      <div class="flex border-b border-neutral-800 mb-6 gap-2">
        <button id="singleTabBtn" onclick="switchMode('single')" class="px-4 py-2 font-orbitron text-xs font-bold border-b-2 border-emerald-400 text-emerald-400 transition cursor-pointer">
          [1] SINGLE DAILY LECTURE
        </button>
        <button id="bulkTabBtn" onclick="switchMode('bulk')" class="px-4 py-2 font-orbitron text-xs font-bold border-b-2 border-transparent text-neutral-400 hover:text-white transition cursor-pointer">
          [2] BULK TSV ARCHIVE UPLOAD
        </button>
      </div>

      <!-- ================= MODE 1: SINGLE LECTURE ================= -->
      <div id="singleSection" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-neutral-400 font-mono mb-1 block">SELECT TARGET SQUADRON</label>
            <select id="squadronSelect" class="w-full bg-black border border-neutral-700 text-emerald-400 p-2.5 rounded-lg text-sm outline-none">
              <option value="cds-kilo">CDS OTA Squadron</option>
              <option value="cds-math">CDS Mathematics Specialist</option>
              <option value="afcat">AFCAT Squadron</option>
              <option value="capf">CAPF Squadron</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-neutral-400 font-mono mb-1 block">MODULE / SUBJECT NAME</label>
            <input id="subjectInput" type="text" placeholder="e.g. Physical Geography, Polity" class="w-full bg-black border border-neutral-700 text-white p-2.5 rounded-lg text-sm outline-none focus:border-emerald-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-neutral-400 font-mono mb-1 block">CHAPTER NAME (स्क्वायर कार्ड बॉक्स)</label>
            <input id="chapterInput" type="text" placeholder="e.g. Geomorphology, Ratio & Proportion" class="w-full bg-black border border-neutral-700 text-white p-2.5 rounded-lg text-sm outline-none focus:border-emerald-500">
          </div>
          <div class="grid grid-cols-3 gap-2">
            <div class="col-span-1">
              <label class="text-xs text-neutral-400 font-mono mb-1 block">CLASS #</label>
              <input id="orderInput" type="number" value="1" class="w-full bg-black border border-neutral-700 text-center text-white p-2.5 rounded-lg text-sm outline-none">
            </div>
            <div class="col-span-2">
              <label class="text-xs text-neutral-400 font-mono mb-1 block">STREAM MODE</label>
              <select id="modeSelect" class="w-full bg-black border border-neutral-700 text-amber-400 p-2.5 rounded-lg text-sm outline-none">
                <option value="recorded">Recorded Vault</option>
                <option value="live">Live Squadron</option>
              </select>
            </div>
          </div>
        </div>

        <div>
          <label class="text-xs text-neutral-400 font-mono mb-1 block">LECTURE TITLE</label>
          <input id="titleInput" type="text" placeholder="e.g. Geomorphology Class 01" class="w-full bg-black border border-neutral-700 text-white p-2.5 rounded-lg text-sm outline-none focus:border-emerald-500">
        </div>

        <div>
          <label class="text-xs text-neutral-400 font-mono mb-1 block">NEXIELD / TARGET VIDEO STREAM URL</label>
          <input id="urlInput" type="text" placeholder="https://vimpd.nexield.in/?title=...&link=..." class="w-full bg-black border border-neutral-700 text-white p-2.5 rounded-lg text-sm outline-none focus:border-emerald-500 font-mono">
        </div>

        <button onclick="dispatchSingleLecture()" id="singleSubmitBtn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-orbitron font-bold py-3 rounded-xl transition text-xs tracking-wider cursor-pointer">
          DISPATCH TO FIRESTORE
        </button>
      </div>

      <!-- ================= MODE 2: BULK TSV ================= -->
      <div id="bulkSection" class="hidden space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="text-xs text-neutral-400 font-mono mb-1 block">TARGET SQUADRON</label>
            <select id="bulkSquadron" class="w-full bg-black border border-neutral-700 text-emerald-400 p-2.5 rounded-lg text-sm outline-none">
              <option value="cds-kilo">CDS OTA Squadron</option>
              <option value="cds-math">CDS Mathematics Specialist</option>
              <option value="afcat">AFCAT Squadron</option>
              <option value="capf">CAPF Squadron</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-neutral-400 font-mono mb-1 block">MODULE / SUBJECT</label>
            <input id="bulkSubject" type="text" placeholder="e.g. Mathematics" class="w-full bg-black border border-neutral-700 text-white p-2.5 rounded-lg text-sm outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-xs text-neutral-400 font-mono mb-1 block">STREAM MODE</label>
            <select id="bulkMode" class="w-full bg-black border border-neutral-700 text-amber-400 p-2.5 rounded-lg text-sm outline-none">
              <option value="recorded">Recorded Vault</option>
              <option value="live">Live Squadron</option>
            </select>
          </div>
        </div>

        <div>
          <label class="text-xs text-neutral-400 font-mono mb-1 block">PASTE TSV DATA (S.No [TAB] Title [TAB] URL)</label>
          <textarea id="bulkTsvData" rows="8" placeholder="1	1. Ratio Class 1	https://vimpd.nexield.in/...&#10;2	2. Ratio Class 2	https://vimpd.nexield.in/..." class="w-full bg-black border border-neutral-700 text-emerald-400 font-mono text-xs p-3 rounded-lg outline-none focus:border-emerald-500"></textarea>
        </div>

        <button onclick="dispatchBulkTsv()" id="bulkSubmitBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-orbitron font-bold py-3 rounded-xl transition text-xs tracking-wider cursor-pointer">
          EXECUTE BULK BATCH DISPATCH
        </button>
      </div>

      <div id="statusMessage" class="mt-4 p-3 rounded-lg text-xs font-mono hidden"></div>

    </div>
  </main>

  <footer class="text-center py-2 text-[10px] font-mono text-neutral-600">
    TEAM PHANTOM MILITARY DISPATCH GATEWAY &bull; CONFIDENTIAL
  </footer>

  <!-- ================= FIREBASE LOGIC ================= -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, writeBatch, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD3RVHxAfzduyURhBYafmDKyUjVdUQXYtk",
      authDomain: "team-phantom-enrollment.firebaseapp.com",
      projectId: "team-phantom-enrollment",
      storageBucket: "team-phantom-enrollment.firebasestorage.app",
      messagingSenderId: "658049687096",
      appId: "1:658049687096:web:8464788a43126a6bced0cd"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // GATE PASSCODE (Updated to your chosen key)
    const TERMINAL_KEY = "Hima Phantom 74";

    window.unlockTerminal = () => {
      const entered = document.getElementById("adminPass").value.trim();
      if (entered === TERMINAL_KEY) {
        document.getElementById("authGate").classList.add("hidden");
        document.getElementById("adminConsole").classList.remove("hidden");
      } else {
        alert("CLEARANCE REFUSED: INVALID CREDENTIALS");
      }
    };

    // Enter Key दबाने पर सीधा अनलॉक
    document.getElementById("adminPass").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        window.unlockTerminal();
      }
    });

    window.switchMode = (mode) => {
      const singleSec = document.getElementById("singleSection");
      const bulkSec = document.getElementById("bulkSection");
      const sBtn = document.getElementById("singleTabBtn");
      const bBtn = document.getElementById("bulkTabBtn");

      if (mode === 'single') {
        singleSec.classList.remove("hidden");
        bulkSec.classList.add("hidden");
        sBtn.className = "px-4 py-2 font-orbitron text-xs font-bold border-b-2 border-emerald-400 text-emerald-400 transition cursor-pointer";
        bBtn.className = "px-4 py-2 font-orbitron text-xs font-bold border-b-2 border-transparent text-neutral-400 hover:text-white transition cursor-pointer";
      } else {
        singleSec.classList.add("hidden");
        bulkSec.classList.remove("hidden");
        bBtn.className = "px-4 py-2 font-orbitron text-xs font-bold border-b-2 border-amber-400 text-amber-400 transition cursor-pointer";
        sBtn.className = "px-4 py-2 font-orbitron text-xs font-bold border-b-2 border-transparent text-neutral-400 hover:text-white transition cursor-pointer";
      }
    };

    function showStatus(msg, isSuccess) {
      const box = document.getElementById("statusMessage");
      box.className = `mt-4 p-3 rounded-lg text-xs font-mono ${isSuccess ? 'bg-emerald-950/80 text-emerald-400 border border-emerald-500/50' : 'bg-red-950/80 text-red-400 border border-red-500/50'}`;
      box.innerHTML = msg;
      box.classList.remove("hidden");
      setTimeout(() => box.classList.add("hidden"), 6000);
    }

    // 1. Single Lecture Dispatch
    window.dispatchSingleLecture = async () => {
      const squadron = document.getElementById("squadronSelect").value;
      const subject = document.getElementById("subjectInput").value.trim();
      const chapter = document.getElementById("chapterInput").value.trim();
      const order = parseInt(document.getElementById("orderInput").value) || 1;
      const mode = document.getElementById("modeSelect").value;
      const title = document.getElementById("titleInput").value.trim();
      const url = document.getElementById("urlInput").value.trim();

      if (!subject || !chapter || !title || !url) {
        showStatus("[ERROR] Module, Chapter, Title, and URL are mandatory.", false);
        return;
      }

      const btn = document.getElementById("singleSubmitBtn");
      btn.innerText = "TRANSMITTING...";
      btn.disabled = true;

      try {
        await addDoc(collection(db, "tactical_curriculum"), {
          squadron: squadron,
          subject: subject,
          chapter: chapter,
          order: order,
          mode: mode,
          title: title,
          url: url,
          createdAt: serverTimestamp()
        });

        showStatus(`[CONFIRMED] Lecture "${title}" successfully stored under ${chapter}.`, true);
        document.getElementById("titleInput").value = "";
        document.getElementById("urlInput").value = "";
        document.getElementById("orderInput").value = order + 1;
      } catch (e) {
        showStatus(`[FAILURE] Firestore Error: ${e.message}`, false);
      } finally {
        btn.innerText = "DISPATCH TO FIRESTORE";
        btn.disabled = false;
      }
    };

    // 2. Bulk TSV Dispatch
    window.dispatchBulkTsv = async () => {
      const squadron = document.getElementById("bulkSquadron").value;
      const subject = document.getElementById("bulkSubject").value.trim();
      const mode = document.getElementById("bulkMode").value;
      const tsv = document.getElementById("bulkTsvData").value.trim();

      if (!subject || !tsv) {
        showStatus("[ERROR] Module/Subject and TSV Data are required.", false);
        return;
      }

      const lines = tsv.split('\n');
      const btn = document.getElementById("bulkSubmitBtn");
      btn.innerText = "BATCH PROCESSING...";
      btn.disabled = true;

      try {
        let batch = writeBatch(db);
        let count = 0;
        let batchCount = 0;

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;
          
          const parts = line.split('\t');
          if (parts.length < 3) continue;

          const sNo = parseInt(parts[0].trim()) || (i + 1);
          const fullTitle = parts[1].trim();
          const url = parts[2].trim();

          // ऑटोमैटिक चैप्टर निकालना (Title से)
          let chapterName = "General Module";
          const lower = fullTitle.toLowerCase();
          if (lower.includes("ratio")) chapterName = "Ratio & Proportion";
          else if (lower.includes("percentage")) chapterName = "Percentage";
          else if (lower.includes("time and work")) chapterName = "Time & Work";
          else if (lower.includes("speed") || lower.includes("distance")) chapterName = "Speed, Time & Distance";
          else if (lower.includes("profit")) chapterName = "Profit & Loss";
          else if (lower.includes("average")) chapterName = "Average";
          else if (lower.includes("geometry")) chapterName = "Geometry";
          else if (lower.includes("mensuration")) chapterName = "Mensuration";
          else if (lower.includes("trigonometry")) chapterName = "Trigonometry";
          else {
            const words = fullTitle.replace(/^[0-9.]+\s*/, '').split(' ');
            chapterName = words.slice(0, 2).join(' ') || "Core Concepts";
          }

          const docRef = doc(collection(db, "tactical_curriculum"));
          batch.set(docRef, {
            squadron: squadron,
            subject: subject,
            chapter: chapterName,
            order: sNo,
            mode: mode,
            title: fullTitle,
            url: url,
            createdAt: serverTimestamp()
          });

          count++;
          batchCount++;

          // Firestore बैच लिमिट (अधिकतम 500)
          if (batchCount === 450) {
            await batch.commit();
            batch = writeBatch(db);
            batchCount = 0;
          }
        }

        if (batchCount > 0) {
          await batch.commit();
        }

        showStatus(`[BATCH SUCCESS] ${count} Lectures pushed into Firestore successfully!`, true);
        document.getElementById("bulkTsvData").value = "";
      } catch (e) {
        showStatus(`[BATCH FAILURE] Error: ${e.message}`, false);
      } finally {
        btn.innerText = "EXECUTE BULK BATCH DISPATCH";
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
